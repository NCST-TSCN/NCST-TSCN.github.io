<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机座位幸运大转盘</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft Yahei", sans-serif;
            background: linear-gradient(135deg, #2c3e50, #4ca1af);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .wrap {
            text-align: center;
        }
        .turntable-box {
            position: relative;
            width: 420px;
            height: 420px;
            margin: 0 auto 30px;
        }
        /* 转盘指针 */
        .pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-top: 45px solid #ff3b30;
        }
        #turntable {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                #ff7675 0deg 45deg,
                #74b9ff 45deg 90deg,
                #55efc4 90deg 135deg,
                #fdcb6e 135deg 180deg,
                #a29bfe 180deg 225deg,
                #fd79a8 225deg 270deg,
                #00b894 270deg 315deg,
                #ffeaa7 315deg 360deg
            );
            box-shadow: 0 0 0 12px #ffffff, 0 8px 30px rgba(0,0,0,0.3);
            transition: transform 4s cubic-bezier(0.17,0.67,0.13,0.99);
        }
        .result-text {
            font-size: 48px;
            color: #fff;
            font-weight: bold;
            min-height:70px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            margin-bottom:24px;
        }
        button {
            background: linear-gradient(90deg,#ff5252,#ff9800);
            border:none;
            color:#fff;
            font-size:22px;
            padding:14px 48px;
            border-radius:50px;
            cursor:pointer;
            box-shadow:0 6px 20px rgba(255,82,82,0.4);
            transition: all 0.25s;
        }
        button:hover{
            transform: translateY(-2px);
        }
        button:disabled{
            opacity:0.6;
            cursor:not-allowed;
            transform:none;
        }
        .info{
            margin-top:20px;
            color:rgba(255,255,255,0.75);
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="turntable-box">
        <div class="pointer"></div>
        <div id="turntable"></div>
    </div>
    <div class="result-text" id="res">点击按钮转动转盘</div>
    <button id="spinBtn">开始抽取</button>
</div>

<script>
    const turntable = document.getElementById('turntable');
    const resDom = document.getElementById('res');
    const btn = document.getElementById('spinBtn');
    let rotateDeg = 0;
    let isRunning = false;

    btn.onclick = function(){
        if(isRunning) return;
        isRunning = true;
        btn.disabled = true;
        resDom.innerText = "抽取中……";

        // 随机角度，多转几圈
        const randomAdd = 1440 + Math.floor(Math.random() * 2160);
        rotateDeg += randomAdd;
        turntable.style.transform = `rotate(${rotateDeg}deg)`;

        setTimeout(()=>{
            // 生成结果：1‑9列，1‑8排
            const col = Math.floor(Math.random() * 9)+1;
            const row = Math.floor(Math.random() * 8)+1;
            resDom.innerText = `第${col}列 第${row}排`;
            isRunning = false;
            btn.disabled = false;
        },4000);
    }
</script>
</body>
</html>
