<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>化学实验操作正误判断</title>
<style>
  :root{
    --bg:#f1f5f9; --card:#ffffff; --line:#e2e8f0;
    --ink:#0f172a; --sub:#64748b;
    --blue:#2563eb; --green:#16a34a; --red:#dc2626; --amber:#d97706;
    --ok-bg:#f0fdf4; --err-bg:#fef2f2; --blue-bg:#eff6ff;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    background:var(--bg); color:var(--ink);
    display:flex; flex-direction:column; min-height:100vh;
  }
  header{
    background:linear-gradient(135deg,#1e3a8a,#2563eb);
    color:#fff; padding:14px 18px; display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:8px; box-shadow:0 2px 10px rgba(30,58,138,.25);
    position:relative; z-index:60;
  }
  header .title{font-size:20px;font-weight:800;letter-spacing:1px;}
  header .sub{font-size:12px;opacity:.85;margin-top:2px;}
  .hd-btns{display:flex;gap:8px;}
  .btn{
    border:none;border-radius:10px;padding:9px 16px;font-size:14px;font-weight:700;cursor:pointer;
    transition:transform .08s, box-shadow .08s; user-select:none;
  }
  .btn:active{transform:scale(.96);}
  .btn.white{background:#fff;color:#1e3a8a;}
  .btn.ghost{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35);}
  .btn.blue{background:var(--blue);color:#fff;}
  .btn.green{background:var(--green);color:#fff;}
  .btn.red{background:var(--red);color:#fff;}
  .btn.gray{background:#e2e8f0;color:#334155;}
  .btn.big{font-size:16px;padding:14px 26px;border-radius:14px;}
  main{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:18px 16px 40px;}
  .view{display:none;}
  .view.active{display:block;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 8px rgba(15,23,42,.05);}
  .seg{display:flex;gap:8px;flex-wrap:wrap;}
  .seg .btn.on{background:var(--blue);color:#fff;box-shadow:0 3px 10px rgba(37,99,235,.35);}
  .seg .btn.off{background:#e2e8f0;color:#475569;}
  .h2{font-size:17px;font-weight:800;margin:14px 0 10px;display:flex;align-items:center;gap:8px;}
  .h2 .tag{font-size:12px;font-weight:700;color:var(--sub);background:#f1f5f9;border-radius:20px;padding:2px 10px;}
  /* 首页 */
  .hero{text-align:center;margin:26px 0 8px;}
  .hero .big{font-size:26px;font-weight:900;letter-spacing:2px;}
  .hero .small{color:var(--sub);font-size:14px;margin-top:6px;}
  .mode-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:20px;}
  .mode-card{padding:22px;cursor:pointer;border:2px solid var(--line);transition:all .15s;}
  .mode-card:hover{border-color:var(--blue);transform:translateY(-2px);box-shadow:0 6px 18px rgba(37,99,235,.12);}
  .mode-card .ic{font-size:30px;}
  .mode-card .nm{font-size:18px;font-weight:800;margin:10px 0 6px;}
  .mode-card .ds{color:var(--sub);font-size:13px;line-height:1.6;}
  /* 学习模式 */
  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;}
  .topic-card{padding:12px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;}
  .topic-card:hover{border-color:var(--blue);transform:translateY(-2px);box-shadow:0 6px 18px rgba(37,99,235,.12);}
  .topic-card .pic{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;height:130px;display:flex;align-items:center;justify-content:center;}
  .topic-card .pic svg,.topic-card .pic img{max-width:100%;max-height:128px;width:auto;height:auto;}
  .topic-card .nm{font-size:14px;font-weight:800;margin-top:8px;line-height:1.4;margin-top:auto;padding-top:8px;}
  .topic-card .vol{font-size:11px;color:var(--sub);margin-top:2px;}
  .vol-badge{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;}
  .vol-up{background:#eff6ff;color:#1d4ed8;}
  .vol-down{background:#fef3c7;color:#b45309;}
  .unit-badge{background:#f0fdf4;color:#15803d;margin-left:4px;}
  /* 弹窗 */
  .mask{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:16px;overflow-y:auto;}
  .mask.show{display:flex;}
  .modal{margin:auto;}
  .modal{background:#fff;border-radius:18px;max-width:min(880px,100%);width:100%;max-height:calc(100vh - 32px);overflow-y:auto;padding:20px;}
  .modal h3{font-size:18px;font-weight:900;display:flex;align-items:center;gap:10px;}
  .modal .x{margin-left:auto;cursor:pointer;background:#f1f5f9;border:none;border-radius:10px;width:34px;height:34px;font-size:18px;color:#475569;}
  .ok-row{display:flex;gap:16px;align-items:flex-start;margin:16px 0;flex-wrap:wrap;}
  .ok-row .pic{flex:0 0 300px;height:200px;display:flex;align-items:center;justify-content:center;}
  .ok-row .pic svg,.ok-row .pic img{max-width:100%;max-height:198px;width:auto;height:auto;border:1px solid var(--line);border-radius:12px;background:#fff;}
  .ok-row .info{flex:1;min-width:240px;}
  .ok-row .info .t{color:var(--green);font-weight:900;font-size:16px;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
  .ok-row .info .pt{background:var(--ok-bg);border:1px solid #bbf7d0;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.7;color:#14532d;}
  .err-list{display:grid;gap:14px;margin-top:6px;}
  .err-item{border:1px solid #fecaca;background:var(--err-bg);border-radius:14px;padding:14px;}
  .err-item .hd{display:flex;align-items:center;gap:8px;font-weight:900;color:var(--red);font-size:15px;margin-bottom:10px;}
  .err-item .body{display:flex;gap:14px;flex-wrap:wrap;}
  .err-item .pic{flex:0 0 230px;height:160px;display:flex;align-items:center;justify-content:center;}
  .err-item .pic svg,.err-item .pic img{max-width:100%;max-height:158px;width:auto;height:auto;border:1px solid #fecaca;border-radius:10px;background:#fff;}
  .err-item .meta{flex:1;min-width:220px;display:grid;gap:8px;font-size:13px;line-height:1.6;}
  .err-item .meta b{font-weight:800;}
  .e-reason{background:#fff;border-radius:10px;padding:9px 11px;}
  .e-reason .k{color:var(--amber);font-weight:900;}
  .e-harm{background:#fff;border-radius:10px;padding:9px 11px;}
  .e-harm .k{color:var(--red);font-weight:900;}
  .e-fix{background:#fff;border-radius:10px;padding:9px 11px;}
  body.hide-explain .e-reason,body.hide-explain .e-harm,body.hide-explain .e-fix{display:none;}
  .e-fix .k{color:var(--green);font-weight:900;}
  /* 考试 */
  .exam-stage{text-align:center;padding:30px 18px;}
  .exam-stage .q-no{font-size:13px;color:var(--sub);font-weight:700;letter-spacing:2px;}
  .exam-stage .q-pic{display:inline-block;margin:16px 0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;max-width:420px;width:100%;}
  .exam-stage .q-pic svg{width:100%;height:auto;}
  .q-title{font-size:18px;font-weight:900;margin:6px 0 16px;}
  .judge{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
  .judge .btn{min-width:130px;font-size:16px;padding:13px 22px;}
  .feedback{margin-top:16px;padding:14px;border-radius:12px;text-align:left;font-size:13px;line-height:1.7;}
  .feedback.right{background:var(--ok-bg);border:1px solid #bbf7d0;color:#14532d;}
  .feedback.wrong{background:var(--err-bg);border:1px solid #fecaca;color:#7f1d1d;}
  .feedback .fb-t{font-weight:900;font-size:15px;margin-bottom:6px;}
  .score-board{text-align:center;padding:30px 18px;}
  .score-board .score{font-size:54px;font-weight:900;color:var(--blue);}
  .score-board .score-desc{color:var(--sub);margin:6px 0 18px;}
  .review-list{display:grid;gap:10px;text-align:left;margin-top:18px;max-width:640px;margin-left:auto;margin-right:auto;}
  .review-item{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;background:#fff;}
  .review-item .r-pic{flex:0 0 90px;}
  .review-item .r-pic svg{width:100%;height:auto;border-radius:8px;border:1px solid var(--line);}
  /* 真实图片优先：images/<key>.png 存在则替换 SVG */
  .img-wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
  .img-wrap .scene-img{max-width:100%;max-height:100%;object-fit:contain;opacity:0;transition:opacity .2s;}
  .img-wrap .scene-svg{width:100%;}
  .topic-card .pic .img-wrap,.ok-row .pic .img-wrap,.err-item .pic .img-wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
  .topic-card .pic .img-wrap .scene-svg svg,
  .ok-row .pic .img-wrap .scene-svg svg,
  .err-item .pic .img-wrap .scene-svg svg,
  .exam-stage .q-pic .img-wrap .scene-svg svg,
  .review-item .r-pic .img-wrap .scene-svg svg{max-width:100%;max-height:100%;width:auto;height:auto;display:block;}
  .review-item .r-info{flex:1;font-size:13px;line-height:1.6;}
  .review-item .r-info .nm{font-weight:800;font-size:14px;}
  .pill{display:inline-block;font-size:11px;font-weight:900;border-radius:20px;padding:2px 10px;margin-right:6px;}
  .pill.right{background:var(--ok-bg);color:var(--green);border:1px solid #bbf7d0;}
  .pill.wrong{background:var(--err-bg);color:var(--red);border:1px solid #fecaca;}
  .toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 20px;border-radius:12px;font-size:14px;z-index:99;opacity:0;pointer-events:none;transition:opacity .25s;}
  .toast.show{opacity:1;}
  .foot-note{text-align:center;color:#94a3b8;font-size:12px;padding:16px 0 24px;}
  .btn.orange{background:#f97316;color:#fff;}
  /* PK 布局 */
  .pk-wrap{display:flex;gap:14px;align-items:stretch;justify-content:center;flex-wrap:nowrap;margin-top:10px;max-width:860px;margin-left:auto;margin-right:auto;}
  .pk-side{flex:1 1 0;min-width:170px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 12px;text-align:center;}
  .pk-side.A{border-color:#3b82f6;}
  .pk-side.B{border-color:#f97316;}
  .pk-side .who{font-weight:900;font-size:19px;margin-bottom:10px;}
  .pk-side.A .who{color:#1d4ed8;}
  .pk-side.B .who{color:#ea580c;}
  .pk-side .pbtns{display:flex;flex-direction:column;gap:8px;}
  .pk-side .pbtns button{width:100%;font-size:15px;padding:11px 10px;}
  .pk-side .pbtns button:disabled{opacity:.45;}
  .pk-side .picked{margin-top:10px;font-size:16px;font-weight:800;min-height:24px;}
  .pk-side.done{background:#f0f9ff;}
  .pk-side.B.done{background:#fff7ed;}
  .pk-center{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;max-width:360px;}
  .pk-center .q-pic{margin:6px 0;}
  .pk-result{margin-top:14px;padding:12px 14px;border-radius:12px;background:#f1f5f9;text-align:left;font-size:13px;line-height:1.7;}
  .pk-score-row{display:flex;gap:14px;justify-content:center;align-items:stretch;flex-wrap:wrap;margin:14px 0;}
  .pk-score-card{flex:1;max-width:260px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:18px 14px;text-align:center;}
  .pk-score-card.A{border-color:#3b82f6;}
  .pk-score-card.B{border-color:#f97316;}
  .pk-score-card .who{font-weight:900;font-size:16px;margin-bottom:6px;}
  .pk-score-card .big-num{font-size:46px;font-weight:900;}
  .pk-score-card.A .big-num{color:#1d4ed8;}
  .pk-score-card.B .big-num{color:#ea580c;}
  .pk-score-card .tt{font-size:12px;color:var(--sub);margin-top:4px;}
  .winner-banner{font-size:20px;font-weight:900;text-align:center;padding:12px;border-radius:12px;background:#fef9c3;color:#854d0e;margin-bottom:10px;}
  .mcq-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:860px;margin:10px auto;}
  .mcq-card{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;position:relative;transition:transform .12s,border-color .12s;}
  .mcq-card:hover{transform:translateY(-2px);border-color:var(--blue);}
  .mcq-card .letter{position:absolute;top:6px;left:6px;width:24px;height:24px;border-radius:50%;background:#1e3a8a;color:#fff;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;z-index:2;}
  .mcq-card .pic{height:140px;display:flex;align-items:center;justify-content:center;}
  .pk-mode .mcq-card .pic{height:185px;}
  .pk-mode .mcq-card .pic svg,.pk-mode .mcq-card .pic img{max-height:183px;}
  .mcq-card .pic svg,.mcq-card .pic img{max-width:100%;max-height:140px;width:auto;height:auto;border-radius:8px;display:block;}
  .mcq-card.picked-right{border-color:var(--green);background:#f0fdf4;box-shadow:0 0 0 3px rgba(22,163,74,.25);}
  .mcq-card.picked-wrong{border-color:var(--red);background:#fef2f2;box-shadow:0 0 0 3px rgba(220,38,38,.25);}
  .mcq-card.dim{opacity:.45;}
  .pk-abtn{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
  .pk-abtn button{min-width:56px;font-size:20px;padding:13px 0;font-weight:900;}
  @media (max-width:900px){
    main{padding:12px 10px 30px;}
    .pk-wrap{flex-direction:column;max-width:560px;}
    .pk-center{order:-1;max-width:100%;flex-direction:row;gap:14px;flex-wrap:wrap;justify-content:center;}
    .mcq-grid{grid-template-columns:repeat(2,1fr);gap:10px;}
    .mcq-card .pic svg,.mcq-card .pic img{max-height:150px;}
    .topic-grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr));}
    .toolbar{gap:8px;}
    .volSeg,.seg{flex-wrap:wrap;}
  }
  @media (max-width:640px){
    .ok-row .pic{flex-basis:100%;}
    .err-item{flex-direction:column;}
    .err-item .pic{flex-basis:100%;}
    .topic-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
    .topic-card .pic svg,.topic-card .pic img{max-height:108px;}
    .hero .big{font-size:20px;}
    .hd-btns{gap:6px;}
    .hd-btns .btn{padding:6px 10px;font-size:13px;}
    .modal{padding:14px;margin:0;}
    .mcq-grid{grid-template-columns:repeat(2,1fr);gap:8px;}
    .mcq-card .pic svg,.mcq-card .pic img{max-height:120px;}
    .mcq-card{padding:8px;}
    .mcq-card .ans-btn{font-size:17px;padding:10px;}
    .pk-score-card{padding:12px 10px;}
    header{padding:10px 12px;}
    .title{font-size:18px !important;}
  }
  /* 小知识按钮 */
  .trivia-btn{display:inline-block;margin:6px 0 0;background:#fef9c3;color:#854d0e;border:1px solid #fde047;border-radius:10px;padding:6px 12px;font-size:13px;cursor:pointer;}
  .trivia-btn:hover{background:#fef08a;}
  .trivia-box{margin-top:8px;background:#fffbeb;border:1px dashed #fbbf24;border-radius:10px;padding:10px 12px;font-size:13.5px;color:#78350f;display:none;}
  .trivia-box.show{display:block;}
</style>
</head>
<body>
<header>
  <div>
    <div class="title">🧪 化学实验操作正误判断</div>
  </div>
  <div class="hd-btns">
    <button class="btn ghost" id="expBtn">💡 解析：开</button>
    <button class="btn ghost" id="fontBtn">🔤 字体</button>
    <button class="btn ghost" id="homeBtn">首页</button>
    <button class="btn white" id="fsBtn">全屏</button>
  </div>
</header>

<main>
  <!-- 首页 -->
  <div class="view active" id="homeView">
    <div class="hero">
      <div class="big">实验操作 · 正误我判断</div>
      <div class="small">先看正确操作，再揪出常见错误：错因、危害后果、改正方法一目了然</div>
    </div>
    <div class="card" style="margin-top:20px;padding:18px;">
      <div class="h2">选择分册 <span class="tag">决定学习和考试的范围</span></div>
      <div class="seg" id="homeVolSeg"></div>
    </div>
    <div class="mode-grid">
      <div class="card mode-card" id="learnModeCard">
        <div class="ic">📖</div>
        <div class="nm">学习模式</div>
        <div class="ds">按条目浏览正确操作示意图；点开任意操作，查看该操作常见的错误做法、错因、危害后果与改正方法。</div>
      </div>
      <div class="card mode-card" id="examModeCard">
        <div class="ic">✍️</div>
        <div class="nm">考试模式</div>
        <div class="ds">从所选分册随机抽 4 道题：1 个正确操作 + 3 个错误操作，逐题判断正误，考后给出得分与完整解析。</div>
      </div>
    </div>
  </div>

  <!-- 学习模式 -->
  <div class="view" id="learnView">
    <div class="card" style="padding:16px;">
      <div class="toolbar">
        <div class="h2" style="margin:0;">📖 学习模式</div>
        <div class="seg" id="learnVolSeg"></div>
        <div class="seg" id="learnUnitSeg" style="display:none"></div>
        <div class="seg" style="margin-left:auto;" id="learnNav"></div>
      </div>
      <div class="topic-grid" id="learnGrid"></div>
    </div>
  </div>

  <!-- 考试模式 -->
  <div class="view" id="examView">
    <div class="card" style="padding:16px;">
      <div class="toolbar">
        <div class="h2" style="margin:0;">✍️ 考试模式</div>
        <div class="seg" id="examVolSeg"></div>
        <div class="seg" id="examUnitSeg" style="display:none"></div>
        <div class="seg" style="margin-left:auto;" id="examNav"></div>
      </div>
      <div id="examBody"></div>
    </div>
  </div>
</main>

<div class="mask" id="mask">
  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ============ 工具 ============ */
function $(id){ return document.getElementById(id); }
function toast(msg){
  var t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove('show'); }, 1800);
}
/* 音效 */
var AC=null;
function beep(freq,dur,type,vol){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    var o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    g.gain.value=vol||0.12;
    o.connect(g); g.connect(AC.destination);
    var t0=AC.currentTime;
    g.gain.setValueAtTime(vol||0.12,t0);
    g.gain.exponentialRampToValueAtTime(0.001,t0+(dur||0.2));
    o.start(t0); o.stop(t0+(dur||0.2));
  }catch(e){}
}
var sndClick=function(){beep(520,0.08,'triangle',0.08);};
var sndRight=function(){beep(660,0.12,'sine',0.1);setTimeout(function(){beep(880,0.15,'sine',0.1);},90);};
var sndWrong=function(){beep(220,0.25,'sawtooth',0.08);setTimeout(function(){beep(160,0.3,'sawtooth',0.08);},120); if(navigator.vibrate){ try{ navigator.vibrate([80,40,120]); }catch(e){} } };

/* ============ SVG 图元 ============ */
/* 简单画风：白底、深灰描边。所有图元函数返回SVG字符串 */
var INK='#334155', LIGHT='#94a3b8', RED='#dc2626', GREEN='#16a34a', AMBER='#d97706';

/* 桌面 */
function bench(y){
  return '<rect x="6" y="'+y+'" width="216" height="11" rx="5" fill="#f6ecdc" stroke="none"/>'+
         '<rect x="6" y="'+(y+8)+'" width="216" height="4" fill="#e5d3b5"/>'+
         '<rect x="6" y="'+y+'" width="216" height="3" rx="1.5" fill="#ffffff" opacity="0.55"/>';
}
/* 玻璃与液体渐变定义 */
function defs(){
  return '<defs>'+
    '<linearGradient id="gg" x1="0" y1="0" x2="1" y2="0">'+
      '<stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#eaf3fc"/><stop offset="1" stop-color="#cfE4f7"/>'+
    '</linearGradient>'+

/* ============ 状态 ============ */
var state={ vol:'all', unitRange:6, unitSel:0, mode:'home' };

/* ============ 视图切换 ============ */
function show(name){
  document.body.classList.remove('pk-mode');
  ['homeView','learnView','examView'].forEach(function(v){ $(v).classList.toggle('active', v===name+'View'); });
  state.mode=name;
  window.scrollTo(0,0);
  if(name==='learn') renderLearn();
  if(name==='exam') renderExamSetup();
}
$('homeBtn').onclick=function(){ sndClick(); show('home'); };
$('learnModeCard').onclick=function(){ sndClick(); show('learn'); };
$('examModeCard').onclick=function(){ sndClick(); show('exam'); };

/* 全屏 */
$('fsBtn').onclick=function(){
  sndClick();
  try{
    if(document.fullscreenElement||document.webkitFullscreenElement){ document.exitFullscreen&&document.exitFullscreen(); document.webkitExitFullscreen&&document.webkitExitFullscreen(); }
    else{
      var el=document.documentElement;
      (el.requestFullscreen||el.webkitRequestFullscreen).call(el);
    }
  }catch(e){ toast('全屏已被浏览器限制'); }
};

var _zoomLevels=[1,1.1,1.2,1.5,2.0,0.9];
var _zoomIdx=0;
$('fontBtn').onclick=function(){
  sndClick();
  _zoomIdx=(_zoomIdx+1)%_zoomLevels.length;
  var z=_zoomLevels[_zoomIdx];
  document.body.style.zoom=z;
  var lbl=['标准','大','超大','超超大','巨大','小'][_zoomIdx];
  toast('字体大小：'+lbl);
};

/* 解析文字显示/隐藏 */
$('expBtn').onclick=function(){
  sndClick();
  var off=document.body.classList.toggle('hide-explain');
  this.textContent=off?'💡 解析：关':'💡 解析：开';
  toast(off?'解析已隐藏（只看图片自己想）':'解析已显示');
};

/* ============ 分册选择 ============ */
function volSeg(containerId,cur,cb){
  var c=$(containerId); c.innerHTML='';
  var opts=[['all','全册'],['up','上册'],['down','下册']];
  opts.forEach(function(o){
    var b=document.createElement('button');
    b.className='btn '+(cur===o[0]?'on':'off');
    b.textContent=o[1];
    b.onclick=function(){ sndClick(); cb(o[0]); };
    c.appendChild(b);
  });
}
function filtered(){
  var list = (state.vol==='all') ? TOPICS : TOPICS.filter(function(t){ return t.vol===state.vol; });
  if(state.vol==='up'){
    if(state.mode==='exam'){
      // 考试模式：累计范围 1/2/4/6（含 ≤该单元的所有单元）
      if(state.unitRange>0) list = list.filter(function(t){ return t.unit && t.unit<=state.unitRange; });
    }else{
      // 学习模式：精确单元 1/2/4/6；0=全部
      if(state.unitSel>0) list = list.filter(function(t){ return t.unit===state.unitSel; });
    }
  }
  return list;
}
/* 单元筛选（仅上册）。mode:'exact'=精确单元；'cum'=累计范围 */
function unitSeg(containerId,cur,cb,mode){
  var c=$(containerId); c.innerHTML='';
  if(state.vol!=='up'){ c.style.display='none'; return; }
  c.style.display='';
  var opts;
  if(mode==='cum'){
    opts=[[1,'第1单元'],[2,'第1~2单元'],[4,'第1~4单元'],[6,'第1~6单元']];
  }else{
    opts=[[0,'全部单元'],[1,'第1单元'],[2,'第2单元'],[4,'第4单元'],[6,'第6单元']];
  }
  opts.forEach(function(o){
    var b=document.createElement('button');
    b.className='btn '+(cur===o[0]?'on':'off');
    b.textContent=o[1];
    b.onclick=function(){ sndClick(); cb(o[0]); };
    c.appendChild(b);
  });
}

/* ============ 学习模式 ============ */
function renderLearn(){
  volSeg('learnVolSeg',state.vol,function(v){ state.vol=v; if(v!=='up'){ state.unitSel=0; } renderLearn(); });
  unitSeg('learnUnitSeg',state.unitSel,function(u){ state.unitSel=u; renderLearn(); },'exact');
  $('learnNav').innerHTML='<button class="btn gray" onclick="sndClick();show(\'home\')">← 返回首页</button>';
  var g=$('learnGrid'); g.innerHTML='';
  filtered().forEach(function(t,i){
    var card=document.createElement('div');
    card.className='card topic-card';
    var volTxt=t.vol===UP?'上册':'下册';
    var unitBadge = (t.vol===UP && t.unit) ? '<span class="vol-badge unit-badge">第'+t.unit+'单元</span>' : '';
    card.innerHTML=
      '<div class="pic">'+IMG(t.correct.scene)+'</div>'+
      '<div class="nm">'+t.name+'</div>'+
      '<div class="vol"><span class="vol-badge '+(t.vol===UP?'vol-up':'vol-down')+'">'+volTxt+'</span>'+unitBadge+'</div>';
    card.onclick=function(){ sndClick(); openModal(t); };
    g.appendChild(card);
  });
}
function openModal(t){
  var m=$('modal'); m.innerHTML='';
  var h=document.createElement('h3');
  h.innerHTML='<span>🔬 '+t.name+'</span><button class="x">✕</button>';
  h.querySelector('.x').onclick=closeModal;
  m.appendChild(h);

  /* 正确操作区：支持单个 correct 或多个 corrects */
  var okWrap=document.createElement('div');
  if(t.corrects){
    t.corrects.forEach(function(c,ci){
      var row=document.createElement('div'); row.className='ok-row';
      row.innerHTML=
        '<div class="pic">'+IMG(c.scene)+'</div>'+
        '<div class="info"><div class="t">✓ 正确操作'+(t.corrects.length>1?'（'+(ci+1)+'）':'')+'</div><div class="pt">'+c.point+'</div></div>';
      okWrap.appendChild(row);
    });
  }else{
    var row=document.createElement('div'); row.className='ok-row';
    row.innerHTML=
      '<div class="pic">'+IMG(t.correct.scene)+'</div>'+
      '<div class="info"><div class="t">✓ 正确操作</div><div class="pt">'+t.correct.point+'</div></div>';
    okWrap.appendChild(row);
  }
  m.appendChild(okWrap);

  /* 小知识 */
  if(t.trivia){
    var tb=document.createElement('button');
    tb.className='trivia-btn'; tb.textContent='💡 仪器小知识';
    var tq=document.createElement('div');
    tq.className='trivia-box'; tq.innerHTML='📚 '+t.trivia;
    tb.onclick=function(){ sndClick(); tq.classList.toggle('show'); tb.textContent=tq.classList.contains('show')?'💡 收起小知识':'💡 仪器小知识'; };
    m.appendChild(tb);
    m.appendChild(tq);
  }

  if(t.errors && t.errors.length>0){
    var title=document.createElement('div');
    title.className='h2'; title.innerHTML='<span style="color:var(--red)">✗ 常见错误操作</span><span class="tag">'+t.errors.length+' 种</span>';
    m.appendChild(title);

    var list=document.createElement('div'); list.className='err-list';
    t.errors.forEach(function(e){
      var item=document.createElement('div'); item.className='err-item';
      item.innerHTML=
        '<div class="hd">⚠ 错误操作</div>'+
        '<div class="body">'+
          '<div class="pic">'+IMG(e.scene)+'</div>'+
          '<div class="meta">'+
            '<div class="e-reason"><span class="k">错因：</span>'+e.reason+'</div>'+
            '<div class="e-harm"><span class="k">危害后果：</span>'+e.harm+'</div>'+
            '<div class="e-fix"><span class="k">改正方法：</span>'+e.fix+'</div>'+
          '</div>'+
        '</div>';
      list.appendChild(item);
    });
    m.appendChild(list);
  }else{
    var none=document.createElement('div');
    none.style.cssText='margin-top:14px;padding:12px 16px;background:#f1f5f9;border-radius:10px;color:var(--sub);font-size:13px;';
    none.textContent='本操作以规范正确做法为主，无常见错误操作对比。';
    m.appendChild(none);
  }
  $('mask').classList.add('show');
  m.scrollTop=0;
}
function closeModal(){ $('mask').classList.remove('show'); }
$('mask').onclick=function(e){ if(e.target===this) closeModal(); };

/* ============ 考试模式 ============ */
function renderExamSetup(){
  volSeg('examVolSeg',state.vol,function(v){ state.vol=v; if(v!=='up') state.unitRange=6; renderExamSetup(); });
  unitSeg('examUnitSeg',state.unitRange,function(u){ state.unitRange=u; renderExamSetup(); },'cum');
  $('examNav').innerHTML='<button class="btn gray" onclick="sndClick();show(\'home\')">← 返回首页</button>';
  var body=$('examBody');
  body.innerHTML='<div class="exam-stage">'+
    '<div style="font-size:40px">✍️</div>'+
    '<div class="q-title">下列实验操作正确的是？</div>'+
    '<div style="color:var(--sub);font-size:13px;margin-bottom:18px">范围：'+(state.vol==='all'?'全册（上册+下册）':state.vol===UP?'上册':'下册')+' · 共 4 题，每题 4 个操作图（A/B/C/D），选出正确的一项</div>'+
    '<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">'+
      '<button class="btn blue big" id="startSingleBtn">👤 单人考试</button>'+
      '<button class="btn orange big" id="startPKBtn">⚔️ 双人 PK</button>'+
    '</div>'+
    '<div style="color:var(--sub);font-size:12px;margin-top:12px">双人 PK：两人做同一套题，左右两组 A/B/C/D 按钮分别作答，看谁又快又准</div>'+
  '</div>';
  $('startSingleBtn').onclick=function(){ sndClick(); startExamSingle(); };
  $('startPKBtn').onclick=function(){ sndClick(); startExamPK(); };
}
function shuffle(a){
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
/* 生成一轮：1个正确 + 3个错误（来自不同条目），ABCD 打乱 */
function buildRound(){
  var pool=filtered();
  // 收集该范围内所有"正确场景"：主正确 + 正确补充（corrects）
  var allCorrectScenes=[];
  pool.forEach(function(t){
    allCorrectScenes.push({scene:t.correct.scene, point:t.correct.point, topic:t});
    if(t.corrects){
      t.corrects.forEach(function(c){
        allCorrectScenes.push({scene:c.scene, point:c.point, topic:t});
      });
    }
  });
  var errPool=pool.filter(function(t){ return t.errors && t.errors.length>0; });
  if(errPool.length<3){ toast('当前分册错误题不足 3 道'); return null; }
  var opts=[];
  // 正确选项从全部正确场景中随机抽一个
  var rc=allCorrectScenes[Math.floor(Math.random()*allCorrectScenes.length)];
  opts.push({scene:rc.scene, isRight:true, topic:rc.topic, point:rc.point});
  var usedScenes={}; usedScenes[rc.scene]=true;
  var idxs=shuffle(errPool.map(function(_,i){return i;}));
  for(var k=0;k<3;k++){
    var t=errPool[idxs[k]];
    var e=t.errors[Math.floor(Math.random()*t.errors.length)];
    // 避免和正确场景同图（理论上不会，但保险去重）
    if(usedScenes[e.scene]){ k--; continue; }
    usedScenes[e.scene]=true;
    opts.push({scene:e.scene, isRight:false, topic:t, reason:e.reason, harm:e.harm, fix:e.fix});
  }
  opts=shuffle(opts);
  opts.forEach(function(o,i){ o.label=String.fromCharCode(65+i); });
  return opts;
}
/* ============ 单人 ============ */
function startExamSingle(){
  var rounds=[];
  for(var r=0;r<4;r++){ var rd=buildRound(); if(!rd) return; rounds.push(rd); }
  EXAM={ list:rounds, idx:0, answers:[], score:0 };
  renderQuestion();
}
function renderQuestion(){
  var opts=EXAM.list[EXAM.idx];
  var body=$('examBody');
  var cards='';
  opts.forEach(function(o){
    cards+='<div class="mcq-card" data-label="'+o.label+'" id="card'+o.label+'">'+
      '<div class="letter">'+o.label+'</div><div class="pic">'+IMG(o.scene)+'</div></div>';
  });
  body.innerHTML='<div class="exam-stage">'+
    '<div class="q-no">第 '+(EXAM.idx+1)+' / 4 题</div>'+
    '<div class="q-title">下列实验操作正确的是？</div>'+
    '<div class="mcq-grid">'+cards+'</div>'+
    '<div id="fb" style="max-width:860px;margin:10px auto;text-align:left"></div>'+
  '</div>';
  opts.forEach(function(o){
    $('card'+o.label).onclick=function(){ answer(o.label, opts); };
  });
}
function answer(label, opts){
  var chosen=opts.filter(function(o){return o.label===label;})[0];
  var correctLabel=opts.filter(function(o){return o.isRight;})[0].label;
  var ok=(label===correctLabel);
  EXAM.answers.push({opts:opts, chosen:label, correct:correctLabel, ok:ok});
  if(ok){ EXAM.score++; sndRight(); } else { sndWrong(); }
  opts.forEach(function(o){
    var card=$('card'+o.label);
    card.onclick=null;
    if(o.isRight) card.classList.add('picked-right');
    else if(o.label===label) card.classList.add('picked-wrong');
    else card.classList.add('dim');
  });
  var rightOpt=opts.filter(function(o){return o.isRight;})[0];
  var fb=$('fb');
  var html='<div class="feedback '+(ok?'right':'wrong')+'"><div class="fb-t">'+(ok?'✓ 回答正确':'✗ 回答错误，正确答案是 '+correctLabel)+'</div>';
  html+='<div>正确选项 '+correctLabel+'（'+rightOpt.topic.name+'）：'+rightOpt.point+'</div>';
  if(!ok){
    var badOpt=chosen;
    html+='<div style="margin-top:6px">你选了 '+label+'（'+badOpt.topic.name+'）的问题：'+badOpt.point+'</div>';
  }
  html+='</div><div style="margin-top:12px;text-align:center"><button class="btn blue" id="nextBtn">'+(EXAM.idx===3?'查看成绩':'下一题')+'</button></div>';
  fb.innerHTML=html;
  $('nextBtn').onclick=function(){ sndClick(); EXAM.idx++; EXAM.idx>=4? renderScore() : renderQuestion(); };
}
function renderScore(){
  var body=$('examBody');
  var grade=EXAM.score===4?'满分！实验操作规范意识很强！':EXAM.score>=3?'很不错，继续保持！':EXAM.score>=2?'还需加强，仔细看看解析吧。':'要重视实验规范，安全第一！';
  var html='<div class="score-board">'+
    '<div class="score">'+EXAM.score+' / 4</div>'+
    '<div class="score-desc">'+grade+'</div>'+
    '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">'+
      '<button class="btn blue" id="againBtn">再考一次</button>'+
      '<button class="btn gray" id="homeBtn2">返回首页</button>'+
    '</div>'+
  '</div>';
  html+='<div class="h2">逐题回顾</div><div class="review-list">';
  EXAM.answers.forEach(function(a,idx){
    var pill=a.ok?'<span class="pill right">答对</span>':'<span class="pill wrong">答错</span>';
    var rightOpt=a.opts.filter(function(o){return o.isRight;})[0];
    var badOpt=a.opts.filter(function(o){return o.label===a.chosen;})[0];
    html+='<div class="review-item"><div class="r-pic">'+IMG(rightOpt.scene)+'</div>'+
      '<div class="r-info"><div class="nm">'+(idx+1)+'. 正确答案 '+a.correctLabel+'（'+rightOpt.topic.name+'）'+pill+'</div>'+
      '<div>你选 '+a.chosen+(a.ok?'':'（'+badOpt.topic.name+'）：'+badOpt.reason)+'</div></div></div>';
  });
  html+='</div>';
  body.innerHTML=html;
  $('againBtn').onclick=function(){ sndClick(); startExamSingle(); };
  $('homeBtn2').onclick=function(){ sndClick(); show('home'); };
}
/* 兼容旧调用 */
function startExam(){ startExamSingle(); }
/* ============ 双人 PK（ABCD 选择） ============ */
function startExamPK(){
  document.body.classList.add('pk-mode');
  var rounds=[];
  for(var r=0;r<4;r++){ var rd=buildRound(); if(!rd) return; rounds.push(rd); }
  PK={ list:rounds, idx:0, A:{score:0,times:[],answers:[]}, B:{score:0,times:[],answers:[]}, t0:0 };
  renderQuestionPK();
}
function renderQuestionPK(){
  var opts=PK.list[PK.idx];
  PK.t0=performance.now();
  var body=$('examBody');
  var cards='';
  opts.forEach(function(o){
    cards+='<div class="mcq-card" id="card'+o.label+'"><div class="letter">'+o.label+'</div><div class="pic">'+IMG(o.scene)+'</div></div>';
  });
  function sideHtml(who, pkey){
    var btns='<div class="pk-abtn">';
    ['A','B','C','D'].forEach(function(l){
      btns+='<button class="btn gray" id="'+pkey+l+'">'+l+'</button>';
    });
    btns+='</div>';
    return '<div class="pk-side '+who+'" id="side'+who+'"><div class="who">'+(who==='A'?'🔵 玩家 A':'🟠 玩家 B')+'</div>'+btns+'<div class="picked" id="'+pkey+'Picked"></div></div>';
  }
  body.innerHTML='<div class="exam-stage">'+
    '<div class="q-no">第 '+(PK.idx+1)+' / 4 题</div>'+
    '<div class="q-title">下列实验操作正确的是？</div>'+
    '<div class="mcq-grid">'+cards+'</div>'+
    '<div class="pk-wrap">'+
      sideHtml('A','a')+
      '<div style="flex:0 0 20px"></div>'+
      sideHtml('B','b')+
    '</div>'+
    '<div id="pkFb" style="max-width:860px;margin:10px auto;text-align:left"></div>'+
  '</div>';
  PK.A.done=false; PK.B.done=false;
  ['A','B','C','D'].forEach(function(l){
    $('a'+l).onclick=function(){ pkAnswer('A',l); };
    $('b'+l).onclick=function(){ pkAnswer('B',l); };
  });
}
function pkAnswer(who, label){
  var p=PK[who];
  if(p.done) return;
  var t=((performance.now()-PK.t0)/1000).toFixed(1);
  var opts=PK.list[PK.idx];
  var correctLabel=opts.filter(function(o){return o.isRight;})[0].label;
  var ok=(label===correctLabel);
  p.done=true; p.times.push(parseFloat(t));
  p.answers.push({opts:opts, chosen:label, correct:correctLabel, ok:ok, time:parseFloat(t)});
  if(ok){ p.score++; sndRight(); } else { sndWrong(); }
  var side=$('side'+who);
  side.classList.add('done');
  side.querySelectorAll('button').forEach(function(b){ b.disabled=true; });
  var pkey=who==='A'?'a':'b';
  var picked=$(pkey+'Picked');
  picked.textContent='你选 '+label+' · 用时 '+t+'s';
  picked.style.color=ok?'#16a34a':'#dc2626';
  if(PK.A.done && PK.B.done){
    opts.forEach(function(o){
      var card=$('card'+o.label);
      if(o.label===correctLabel) card.classList.add('picked-right');
    });
    var a=PK.A.answers[PK.A.answers.length-1], b=PK.B.answers[PK.B.answers.length-1];
    var rightOpt=opts.filter(function(o){return o.isRight;})[0];
    var fb=$('pkFb');
    fb.innerHTML='<div class="pk-result">'+
      '<div>正确答案：<b>'+correctLabel+'</b>（'+rightOpt.topic.name+'）—— '+rightOpt.point+'</div>'+
      '<div style="margin-top:6px">🔵 A 选 '+a.chosen+'：'+(a.ok?'<span style="color:#16a34a;font-weight:800">答对</span>':'<span style="color:#dc2626;font-weight:800">答错</span>')+'　　🟠 B 选 '+b.chosen+'：'+(b.ok?'<span style="color:#16a34a;font-weight:800">答对</span>':'<span style="color:#dc2626;font-weight:800">答错</span>')+'</div>'+
      '<div style="margin-top:10px;text-align:center"><button class="btn blue" id="pkNextBtn">'+(PK.idx===3?'查看成绩':'下一题')+'</button></div>'+
    '</div>';
    $('pkNextBtn').onclick=function(){ sndClick(); PK.idx++; PK.idx>=4? renderScorePK() : renderQuestionPK(); };
  }
}
function renderScorePK(){
  var body=$('examBody');
  var aT=PK.A.times.reduce(function(s,x){return s+x;},0);
  var bT=PK.B.times.reduce(function(s,x){return s+x;},0);
  var winner;
  if(PK.A.score>PK.B.score) winner='🔵 玩家 A 获胜！';
  else if(PK.B.score>PK.A.score) winner='🟠 玩家 B 获胜！';
  else if(aT<bT) winner='🔵 玩家 A 用时更短，获胜！';
  else if(bT<aT) winner='🟠 玩家 B 用时更短，获胜！';
  else winner='🤝 平局！再来一局吧！';
  var html='<div class="score-board">'+
    '<div class="winner-banner">'+winner+'</div>'+
    '<div class="pk-score-row">'+
      '<div class="pk-score-card A"><div class="who">🔵 玩家 A</div><div class="big-num">'+PK.A.score+' / 4</div><div class="tt">总用时 '+aT.toFixed(1)+' 秒</div></div>'+
      '<div class="pk-score-card B"><div class="who">🟠 玩家 B</div><div class="big-num">'+PK.B.score+' / 4</div><div class="tt">总用时 '+bT.toFixed(1)+' 秒</div></div>'+
    '</div>'+
    '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">'+
      '<button class="btn orange" id="againPKBtn">再来一局 PK</button>'+
      '<button class="btn gray" id="homeBtn2">返回首页</button>'+
    '</div>'+
  '</div>';
  html+='<div class="h2">逐题回顾</div><div class="review-list">';
  PK.list.forEach(function(opts,idx){
    var a=PK.A.answers[idx], b=PK.B.answers[idx];
    var rightOpt=opts.filter(function(o){return o.isRight;})[0];
    var pillA=a.ok?'<span class="pill right">A'+a.chosen+'对</span>':'<span class="pill wrong">A'+a.chosen+'错</span>';
    var pillB=b.ok?'<span class="pill right">B'+b.chosen+'对</span>':'<span class="pill wrong">B'+b.chosen+'错</span>';
    html+='<div class="review-item"><div class="r-pic">'+IMG(rightOpt.scene)+'</div>'+
      '<div class="r-info"><div class="nm">'+(idx+1)+'. 正确答案 '+a.correctLabel+'（'+rightOpt.topic.name+'） '+pillA+' '+pillB+'</div>'+
      '<div>'+rightOpt.point+'</div></div></div>';
  });
  html+='</div>';
  body.innerHTML=html;
  $('againPKBtn').onclick=function(){ sndClick(); startExamPK(); };
  $('homeBtn2').onclick=function(){ sndClick(); show('home'); };
}

volSeg('homeVolSeg',state.vol,homeVolCb);

document.addEventListener('contextmenu', function(e){ e.preventDefault(); e.stopPropagation(); return false; });

/* 打开页面默认全屏：先尝试自动进入，被浏览器拦截则在用户首次点击/触摸时再进入一次 */
function tryFullscreen(){
  try{
    var el=document.documentElement;
    if(!document.fullscreenElement && !document.webkitFullscreenElement){
      (el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el);
    }
  }catch(e){}
}
window.addEventListener('load', tryFullscreen);
document.addEventListener('pointerdown', function once(){
  tryFullscreen();
  document.removeEventListener('pointerdown', once);
}, {once:true});
