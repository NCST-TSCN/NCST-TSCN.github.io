<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>化学仪器消消乐 · 五关挑战</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --bg-0: #0f172a;
    --bg-1: #1e293b;
    --cell-bg: #f8fafc;
    --cell-border: rgba(148, 163, 184, 0.35);
    --accent: #f59e0b;
    --accent-2: #38bdf8;
    --text-main: #f1f5f9;
    --text-sub: #94a3b8;
    --danger: #ef4444;
    --ok: #22c55e;
}

html, body { height: 100%; }

body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, sans-serif;
    background:
        radial-gradient(1200px 600px at 15% -10%, rgba(56, 189, 248, 0.12), transparent 60%),
        radial-gradient(1000px 700px at 110% 10%, rgba(245, 158, 11, 0.10), transparent 55%),
        linear-gradient(160deg, var(--bg-0) 0%, var(--bg-1) 100%);
    background-attachment: fixed;
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 14px 10px 20px;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    overflow-x: hidden;
}

.view { display: none; width: 100%; flex-direction: column; align-items: center; }
.view.active { display: flex; }

/* ===== 顶栏（游戏视图） ===== */
.topbar {
    width: min(94vw, 720px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 10px;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand .logo {
    width: 38px; height: 38px; border-radius: 10px;
    background: linear-gradient(135deg, #38bdf8, #6366f1);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(56, 189, 248, 0.35);
}
.brand h1 {
    font-size: 20px; font-weight: 800; letter-spacing: 1px;
    background: linear-gradient(90deg, #e2e8f0, #bae6fd);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    white-space: nowrap;
}
.brand small { display: block; font-size: 10px; font-weight: 500; color: var(--text-sub); letter-spacing: 0; -webkit-text-fill-color: var(--text-sub); }
.stats { display: flex; align-items: stretch; gap: 8px; flex-wrap: wrap; }
.stat-card {
    background: rgba(15, 23, 42, 0.65); border: 1px solid rgba(148, 163, 184, 0.25);
    border-radius: 12px; padding: 6px 13px; text-align: center; min-width: 78px;
    backdrop-filter: blur(4px);
}
.stat-card .label { font-size: 10px; color: var(--text-sub); letter-spacing: 1px; margin-bottom: 2px; }
.stat-card .value { font-size: 21px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat-card .value.score { color: var(--accent); }
.stat-card .value.best { color: var(--accent-2); }
.stat-card .value.time { color: var(--ok); }
.stat-card .value.time.urgent { color: var(--danger); animation: blink 0.6s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0.35; } }
.stat-card .value.target { color: #e2e8f0; font-size: 16px; padding-top: 3px; }

.controls { display: flex; gap: 6px; }
.ctrl-btn {
    width: 42px; height: 42px; border-radius: 12px;
    border: 1px solid rgba(148, 163, 184, 0.3);
    background: rgba(15, 23, 42, 0.65); color: var(--text-main);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: transform 0.15s ease, background 0.2s ease; backdrop-filter: blur(4px);
}
.ctrl-btn:hover { background: rgba(51, 65, 85, 0.8); transform: translateY(-2px); }
.ctrl-btn:active { transform: scale(0.92); }
.ctrl-btn svg { width: 20px; height: 20px; }
.ctrl-btn.restart { border-color: rgba(245, 158, 11, 0.5); }
.ctrl-btn.restart svg { stroke: var(--accent); }
.ctrl-btn.back { border-color: rgba(56, 189, 248, 0.4); }
.ctrl-btn.back svg { stroke: var(--accent-2); }

/* ===== 提示条 ===== */
.hintbar {
    width: min(94vw, 720px); display: flex; align-items: center; justify-content: space-between;
    gap: 8px; margin-bottom: 10px; font-size: 12px; color: var(--text-sub);
}
.hintbar .legend { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.hintbar .legend span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.hintbar .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.toast {
    background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(245, 158, 11, 0.5);
    color: var(--accent); padding: 4px 12px; border-radius: 20px; font-size: 12px;
    font-weight: 600; opacity: 0; transform: translateY(-4px);
    transition: opacity 0.25s ease, transform 0.25s ease; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }

/* ===== 棋盘 ===== */
.board-wrap { position: relative; width: min(94vw, 660px); }

/* 模式切换按钮 */
.mode-switch { display:flex; gap:10px; justify-content:center; margin: 6px 0 16px; }
.mode-switch button { padding:9px 22px; border-radius:22px; border:2px solid rgba(148,163,184,.4); background:rgba(15,23,42,.5); color:var(--text-sub); cursor:pointer; font-size:14px; font-weight:600; }
.mode-switch button.active { background:var(--accent); border-color:var(--accent); color:#1c1917; }

/* 规则说明 */
.rules-box { max-width:760px; margin:18px auto 0; padding:14px 18px; background:rgba(15,23,42,.55); border:1px solid rgba(148,163,184,.25); border-radius:12px; text-align:left; }
.rules-box h3 { margin:0 0 8px; font-size:15px; color:var(--accent); }
.rules-box ul { margin:0; padding-left:20px; }
.rules-box li { font-size:13px; line-height:1.7; color:var(--text-sub); margin-bottom:2px; }
.rules-box b { color:#fde68a; }

/* 双人 PK 布局 */.pk-wrap { display:flex; gap:14px; width:min(98vw,1400px); align-items:flex-start; margin:0 auto; box-sizing:border-box; }
.pk-panel { flex:1; min-width:0; max-width:100%; }
.pk-panel .panel-title { text-align:center; font-size:15px; font-weight:800; margin-bottom:6px; }
.pk-panel.p1 .panel-title { color:#7dd3fc; }
.pk-panel.p2 .panel-title { color:#fda4af; }
.pk-stats { display:flex; gap:8px; justify-content:center; margin-bottom:8px; }
.pk-stats .stat-card { min-width:60px; flex:1; }
.pk-stats .stat-card .value { font-size:16px; }
.pk-board-wrap { position:relative; width:100%; max-width:100%; }
.pk-float { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
.pk-board { display:grid; gap:3px; padding:8px; width:100%; max-width:100%; box-sizing:border-box; background:rgba(15,23,42,.55); border:1px solid rgba(148,163,184,.22); border-radius:14px; }
.pk-board .cell { min-width:0; min-height:0; }
.pk-vs { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); z-index:50; font-size:46px; font-weight:900; color:var(--accent); text-shadow:0 4px 18px rgba(0,0,0,.6); pointer-events:none; }
@media (max-width:900px){
  .pk-wrap{ flex-direction:column; }
}
#board {
    display: grid;
    gap: 3px;
    padding: 8px;
    background: rgba(15, 23, 42, 0.55);
    border: 1px solid rgba(148, 163, 184, 0.22);
    border-radius: 14px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255,255,255,0.06);
    backdrop-filter: blur(4px);
}
.cell {
    position: relative; aspect-ratio: 1 / 1;
    background: linear-gradient(145deg, #ffffff, var(--cell-bg));
    border-radius: 5px; border: 1px solid var(--cell-border);
    overflow: hidden; cursor: pointer; touch-action: manipulation;
    transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.18s ease;
    display: flex; align-items: center; justify-content: center;
}
.cell:hover { transform: scale(1.04); z-index: 2; }
.cell img { width: 86%; height: 86%; object-fit: contain; pointer-events: none; -webkit-user-drag: none; transition: transform 0.2s ease; }
.cell .cell-name {
    display: none;
    font-weight: 800;
    text-align: center;
    line-height: 1.1;
    letter-spacing: 1px;
    padding: 0 2px;
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.55);
    pointer-events: none;
    word-break: keep-all;
}
.cell .color-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; opacity: 0.9; }
.cell.selected {
    outline: 2.5px solid var(--accent); outline-offset: -2.5px;
    box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.3), 0 6px 16px rgba(0,0,0,0.35);
    transform: scale(1.07); z-index: 3;
}
.cell.removing { animation: pop 0.32s ease forwards; pointer-events: none; }
@keyframes pop {
    0% { transform: scale(1); opacity: 1; }
    35% { transform: scale(1.22) rotate(6deg); opacity: 1; }
    100% { transform: scale(0); opacity: 0; }
}
.cell.flash-swap { animation: shake 0.3s ease; }
@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-3px); }
    50% { transform: translateX(3px); }
    75% { transform: translateX(-2px); }
}
.cell.falling { transition: transform 0.32s cubic-bezier(0.25, 0.8, 0.35, 1); }
.cell.spawning { animation: spawnIn 0.28s ease backwards; }
@keyframes spawnIn { from { transform: scale(0.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.float-score {
    position: absolute; z-index: 10; font-weight: 900; font-size: 17px; color: var(--accent);
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6); pointer-events: none;
    animation: floatUp 0.9s ease forwards; transform: translate(-50%, -50%);
}
@keyframes floatUp {
    0% { opacity: 0; scale: 0.6; }
    20% { opacity: 1; scale: 1.15; }
    100% { opacity: 0; scale: 1; transform: translate(-50%, -140%); }
}

/* ===== 关卡选择视图 ===== */
.level-head { text-align: center; margin: 6vh 0 4vh; }
.level-head .logo {
    width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 18px;
    background: linear-gradient(135deg, #38bdf8, #6366f1);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 12px 32px rgba(56, 189, 248, 0.4);
}
.level-head h1 { font-size: 28px; font-weight: 900; letter-spacing: 2px; margin-bottom: 6px; }
.level-head p { color: var(--text-sub); font-size: 14px; }
.level-grid {
    width: min(94vw, 800px);
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
}
.level-card {
    background: linear-gradient(160deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.9));
    border: 1px solid rgba(148, 163, 184, 0.25);
    border-radius: 18px;
    padding: 22px 16px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.25s ease, border-color 0.2s ease;
    position: relative;
}
.level-card:hover { transform: translateY(-5px); box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45); border-color: rgba(245, 158, 11, 0.6); }
.level-card .lv-num {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 6px 12px; min-width: 40px; height: 34px; border-radius: 12px; margin-bottom: 10px;
    font-size: 15px; font-weight: 900; white-space: nowrap;
}
.level-card.lv1 .lv-num { background: rgba(34, 197, 94, 0.18); color: #4ade80; }
.level-card.lv2 .lv-num { background: rgba(56, 189, 248, 0.18); color: #38bdf8; }
.level-card.lv3 .lv-num { background: rgba(245, 158, 11, 0.18); color: #fbbf24; }
.level-card.lv4 .lv-num { background: rgba(239, 68, 68, 0.18); color: #f87171; }
.level-card.lv5 .lv-num { background: rgba(139, 92, 246, 0.18); color: #c4b5fd; }
.level-card .lv-size { font-size: 22px; font-weight: 900; margin-bottom: 4px; }
.level-card .lv-title {
    display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-size: 14px; font-weight: 700; margin-bottom: 2px;
}
.level-card .lv-meta { font-size: 12px; color: var(--text-sub); line-height: 1.8; margin-bottom: 10px; }
.level-card .lv-meta b { color: #e2e8f0; }
.level-card .lv-best {
    font-size: 12px; padding: 5px 10px; border-radius: 20px;
    background: rgba(56, 189, 248, 0.12); color: #7dd3fc;
    display: inline-block;
}
.level-card .lv-cleared {
    position: absolute; top: 12px; right: 12px;
    width: 26px; height: 26px; border-radius: 50%;
    background: linear-gradient(135deg, #22c55e, #16a34a);
    display: none; align-items: center; justify-content: center;
    box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);
}
.level-card .lv-cleared.show { display: flex; }
.level-card .lv-cleared svg { width: 14px; height: 14px; stroke: #fff; }

/* ===== 结束面板 ===== */
.overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(2, 6, 23, 0.72); backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center; padding: 20px;
}
.overlay.show { display: flex; }
.end-card {
    background: linear-gradient(160deg, #1e293b, #0f172a);
    border: 1px solid rgba(148, 163, 184, 0.3);
    border-radius: 20px; padding: 30px 34px; text-align: center;
    max-width: 420px; width: 100%;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
    animation: cardIn 0.4s cubic-bezier(0.2, 1.2, 0.35, 1);
}
@keyframes cardIn { from { opacity: 0; transform: translateY(30px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
.end-card .trophy {
    width: 64px; height: 64px; margin: 0 auto 12px; border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
}
.end-card .trophy.win { background: linear-gradient(135deg, #f59e0b, #fbbf24); box-shadow: 0 10px 28px rgba(245, 158, 11, 0.4); }
.end-card .trophy.fail { background: linear-gradient(135deg, #475569, #334155); box-shadow: 0 10px 28px rgba(51, 65, 85, 0.4); }
.end-card .trophy svg { width: 34px; height: 34px; }
.end-card .trophy.win svg { stroke: #78350f; }
.end-card .trophy.fail svg { stroke: #cbd5e1; }
.end-card h2 { font-size: 24px; font-weight: 800; margin-bottom: 4px; }
.end-card .sub { color: var(--text-sub); font-size: 13px; margin-bottom: 16px; }
.end-card .big-score { font-size: 50px; font-weight: 900; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1; margin-bottom: 4px; }
.end-card .target-line { color: var(--text-sub); font-size: 13px; margin-bottom: 6px; }
.end-card .target-line b { color: #e2e8f0; }
.end-card .best-line { color: var(--text-sub); font-size: 13px; margin-bottom: 8px; }
.end-card .best-line b { color: var(--accent-2); }
.end-card .verdict {
    font-size: 14px; padding: 10px 16px; border-radius: 12px; margin: 14px 0 20px;
    border: 1px solid;
}
.end-card .verdict.win { background: rgba(34, 197, 94, 0.12); color: #86efac; border-color: rgba(34, 197, 94, 0.3); }
.end-card .verdict.fail { background: rgba(245, 158, 11, 0.12); color: #fcd34d; border-color: rgba(245, 158, 11, 0.3); }
.end-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.end-actions button {
    padding: 12px 22px; border: none; border-radius: 14px; font-size: 14px; font-weight: 700;
    font-family: inherit; cursor: pointer; transition: transform 0.15s ease, box-shadow 0.2s ease;
}
.end-actions button:hover { transform: translateY(-2px); }
.end-actions .again { background: linear-gradient(135deg, #f59e0b, #d97706); color: #1c1917; box-shadow: 0 8px 20px rgba(245, 158, 11, 0.35); }
.end-actions .next { background: linear-gradient(135deg, #22c55e, #16a34a); color: #052e16; box-shadow: 0 8px 20px rgba(34, 197, 94, 0.35); }
.end-actions .level-btn { background: rgba(51, 65, 85, 0.7); color: var(--text-main); border: 1px solid rgba(148, 163, 184, 0.3); }

/* ===== 响应式 ===== */
@media (max-width: 640px) {
    .level-grid { grid-template-columns: repeat(2, 1fr); }
    .level-head h1 { font-size: 23px; }
    .brand h1 { font-size: 17px; }
    .stat-card { min-width: 66px; padding: 5px 9px; }
    .stat-card .value { font-size: 17px; }
    .hintbar .legend span { font-size: 0; }
    .hintbar .legend span i { width: 12px; height: 12px; }
    #board { gap: 2px; padding: 6px; }
    .cell { border-radius: 4px; }
}
</style>
</head>
<body>

<!-- ===== 关卡选择视图 ===== -->
<div class="view active" id="levelView">
    <div class="level-head">
        <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="32" height="32">
                <path d="M9 3h6"></path>
                <path d="M10.5 3v5.2L5.6 17.4a2.1 2.1 0 0 0 1.8 3.2h9.2a2.1 2.1 0 0 0 1.8-3.2L13.5 8.2V3"></path>
            </svg>
        </div>
        <h1>化学仪器消消乐</h1>
        <p>五关挑战 · 图片与名称混着消 · 达标即通关</p>
    </div>
    <div class="mode-switch">
        <button id="modeSingleBtn" class="active" onclick="setGameMode(false)">🧑 单人模式</button>
        <button id="modePkBtn" onclick="setGameMode(true)">⚔️ 双人PK</button>
    </div>
    <div class="level-grid" id="levelGrid"></div>
    <div class="rules-box">
        <h3>游戏规则</h3>
        <ul>
            <li>点击两个相邻的仪器方块交换位置，三个及以上相同仪器连成一线即可消除。</li>
            <li><b>必须图文混合才能消</b>：3 个纯图片、或 3 个纯名称汉字不能消除（交换后会自动换回来）；需要「2 张图 + 1 个名称」或「2 个名称 + 1 张图」。</li>
            <li>图片和文字各占一半，越连分数越高，有连击加成。</li>
            <li>在限定时间内达到目标分数即通关；双人 PK 模式两人同关同时开局，时间到比总分。</li>
        </ul>
    </div>
</div>

<!-- ===== 游戏视图 ===== -->
<div class="view" id="gameView">
    <div class="topbar">
        <div class="brand">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
                    <path d="M9 3h6"></path>
                    <path d="M10.5 3v5.2L5.6 17.4a2.1 2.1 0 0 0 1.8 3.2h9.2a2.1 2.1 0 0 0 1.8-3.2L13.5 8.2V3"></path>
                </svg>
            </div>
            <h1 id="gameTitle">第 1 关<small id="gameSub">8 × 8 · 45 秒</small></h1>
        </div>
        <div class="controls">
            <button class="ctrl-btn back" id="backBtn" title="返回关卡选择" aria-label="返回关卡选择">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path>
                </svg>
            </button>
            <button class="ctrl-btn" id="soundBtn" title="音效开关" aria-label="音效开关">
                <svg viewBox="0 0 24 24" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 5 6 9H2v6h4l5 4V5z"></path>
                    <path id="wavePath" d="M15.5 8.5a5 5 0 0 1 0 7"></path>
                </svg>
            </button>
            <button class="ctrl-btn restart" id="restartBtn" title="再来一次" aria-label="再来一次">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
                    <path d="M21 3v6h-6"></path>
                </svg>
            </button>
        </div>
    </div>

    <div class="hintbar">
        <div class="legend" id="legend"></div>
        <div class="toast" id="toast"></div>
    </div>

    <div class="board-wrap" id="boardWrap" style="width:100%; max-width:100%; margin:0 auto;">
        <div id="board" role="grid" aria-label="消消乐棋盘"></div>
    </div>
</div>

<!-- ===== 结束面板 ===== -->
<div class="overlay" id="endOverlay">
    <div class="end-card">
        <div class="trophy win" id="endTrophy">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 21h8"></path><path d="M12 17v4"></path>
                <path d="M7 4h10v6a5 5 0 0 1-10 0V4z"></path>
                <path d="M7 6H4a2 2 0 0 0 2 4h1"></path>
                <path d="M17 6h3a2 2 0 0 1-2 4h-1"></path>
            </svg>
        </div>
        <h2 id="endTitle">通关！</h2>
        <div class="sub" id="endSub">本关得分</div>
        <div class="big-score" id="endScore">0</div>
        <div class="target-line">目标 <b id="endTarget">500</b> · 本关最高 <b id="endBest">0</b></div>

</div>

<script>
(function () {

    var TYPES = [

    ];

    var LEVELS = [
        { size: 3, seconds: 80,  target: 100,  label: '第 1 关 · 初识', cls: 'lv1' },
        { size: 4, seconds: 120, target: 200,  label: '第 2 关 · 入门', cls: 'lv2' },
        { size: 5, seconds: 160, target: 400,  label: '第 3 关 · 进阶', cls: 'lv3' },
        { size: 6, seconds: 200, target: 700,  label: '第 4 关 · 挑战', cls: 'lv4' },
        { size: 7, seconds: 240, target: 1000, label: '第 5 关 · 大师', cls: 'lv5' }
    ];

    /* ===== 音效（共享） ===== */
    var AudioFX = (function () {
        var ctx = null, muted = false;
        function ensure() {
            if (!ctx) { var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; ctx = new AC(); }
            if (ctx.state === 'suspended') ctx.resume();
            return ctx;
        }
        function tone(freq, dur, type, vol, delay, slideTo) {
            if (muted) return; var c = ensure(); if (!c) return;
            var t0 = c.currentTime + (delay || 0);
            var osc = c.createOscillator(), gain = c.createGain();
            osc.type = type || 'sine';
            osc.frequency.setValueAtTime(freq, t0);
            if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
            var v = vol || 0.16;
            gain.gain.setValueAtTime(0.0001, t0);
            gain.gain.exponentialRampToValueAtTime(v, t0 + 0.012);
            gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
            osc.connect(gain); gain.connect(c.destination);
            osc.start(t0); osc.stop(t0 + dur + 0.05);
        }
        return {
            unlock: function () { ensure(); },
            setMuted: function (m) { muted = m; },
            isMuted: function () { return muted; },
            select: function () { tone(660, 0.06, 'triangle', 0.10); },
            swap: function () { tone(440, 0.07, 'sine', 0.10); tone(550, 0.08, 'sine', 0.08, 0.05); },
            badSwap: function () { tone(200, 0.18, 'sawtooth', 0.06, 0, 140); },
            match: function (combo) {
                var base = [523.25, 659.25, 783.99, 1046.5];
                var n = Math.min(combo, 3);
                for (var i = 0; i < 3; i++) tone(base[i] * Math.pow(1.12, n), 0.13, 'triangle', 0.14, i * 0.055);
                if (combo > 1) tone(base[3] * Math.pow(1.1, n), 0.2, 'sine', 0.12, 0.16);
            },
            win: function () { [523.25,659.25,783.99,1046.5].forEach(function(f,i){tone(f,0.2,'triangle',0.15,i*0.12);}); },
            fail: function () { [392,329.63,261.63].forEach(function(f,i){tone(f,0.2,'triangle',0.13,i*0.14);}); },
            tick: function () { tone(880, 0.05, 'square', 0.05); }
        };
    })();

    /* ===== 存取 ===== */
    function loadBest(lv){ try{var v=parseInt(localStorage.getItem('chemMatchBest_'+lv)||'0',10);return isNaN(v)?0:v;}catch(e){return 0;} }
    function saveBest(lv,v){ try{localStorage.setItem('chemMatchBest_'+lv,String(v));}catch(e){} }
    function isCleared(lv){ try{return localStorage.getItem('chemMatchCleared_'+lv)==='1';}catch(e){return false;} }
    function setCleared(lv){ try{localStorage.setItem('chemMatchCleared_'+lv,'1');}catch(e){} }

    /* ===== 游戏实例工厂 ===== */
    function createGame(container, opts) {
        var SIZE = opts.size, SECONDS = opts.seconds, TARGET = opts.target;
        var board = [], boardMode = [], cells = [];
        var score = 0, comboCount = 0, selected = null, busy = false, running = false;
        var rafId = null, startTs = 0, lastTick = -1, timeLeft = SECONDS;

        container.innerHTML =
          '<div class="pk-stats">'+
            '<div class="stat-card"><div class="label">得分</div><div class="value score pk-score">0</div></div>'+
            '<div class="stat-card"><div class="label">目标</div><div class="value target pk-target">'+TARGET+'</div></div>'+
            '<div class="stat-card"><div class="label">剩余</div><div class="value time pk-time">'+SECONDS+'</div></div>'+
          '</div>'+
          '<div class="pk-board-wrap"><div class="pk-board"></div><div class="pk-float"></div></div>';
        var boardEl = container.querySelector('.pk-board');
        var scoreEl = container.querySelector('.pk-score');
        var timeEl = container.querySelector('.pk-time');
        var floatWrap = container.querySelector('.pk-float');

        function randType(){ return Math.floor(Math.random()*TYPES.length); }
        function hasInitMatch(r,c,t){
            if(c>=2 && board[r][c-1]===t && board[r][c-2]===t) return true;
            if(r>=2 && board[r-1][c]===t && board[r-2][c]===t) return true;
            return false;
        }
        function createBoard(){
            board=[]; boardMode=[];
            for(var r=0;r<SIZE;r++){ board[r]=[]; boardMode[r]=[];
                for(var c=0;c<SIZE;c++){ var t; do{ t=randType(); }while(hasInitMatch(r,c,t));
                    board[r][c]=t; boardMode[r][c]=0; } }
            // 图片与文字数量尽量相等：一半图片(0)一半文字(1)
            var N=SIZE*SIZE, nImg=Math.floor(N/2), modes=[];
            for(var i=0;i<N;i++) modes.push(i<nImg?0:1);
            for(var j=modes.length-1;j>0;j--){ var k=Math.floor(Math.random()*(j+1)); var tmp=modes[j]; modes[j]=modes[k]; modes[k]=tmp; }
            var mi=0;
            for(var rr=0;rr<SIZE;rr++) for(var cc=0;cc<SIZE;cc++) boardMode[rr][cc]=modes[mi++];
        }
        // 若随机棋盘无解，强行构造一个可走步（保证至少一次图文混合可消）
        function forceSolvable(){
            if(hasAnyMove()) return;
            var T=randType();
            // 在一行里放两个相邻同类型、不同形态；在其下方隔一列放第三个同类型
            var r=Math.floor(Math.random()*(SIZE-1));
            var c=Math.floor(Math.random()*(SIZE-2));
            board[r][c]=T; boardMode[r][c]=0;
            board[r][c+1]=T; boardMode[r][c+1]=1;
            // (r+1,c+2) 设为 T，玩家把它和 (r,c+2) 交换即可连成 3 个图文混合
            board[r+1][c+2]=T; boardMode[r+1][c+2]=0;
            // 确保 (r,c+2) 不是 T，否则已自动消除
            if(board[r][c+2]===T) board[r][c+2]=(T+1)%TYPES.length;
            // 再次校验
            if(!hasAnyMove()){ board[r][c+1]=T; boardMode[r][c+1]=0; board[r][c]=T; boardMode[r][c]=1; }
        }
        function buildGrid(){
            boardEl.style.gridTemplateColumns='repeat('+SIZE+',1fr)';
            boardEl.innerHTML=''; cells=[];
            for(var r=0;r<SIZE;r++){ cells[r]=[];
                for(var c=0;c<SIZE;c++){
                    var cell=document.createElement('div'); cell.className='cell';
                    cell.dataset.r=r; cell.dataset.c=c;
                    var img=document.createElement('img'); img.alt=''; img.draggable=false;
                    var nameEl=document.createElement('span'); nameEl.className='cell-name';
                    cell.appendChild(img); cell.appendChild(nameEl);
                    boardEl.appendChild(cell); cells[r][c]=cell;
                    (function(cell){ cell.addEventListener('pointerdown',function(e){e.preventDefault();onDown(e);}); })(cell);
                }
            }
        }
        function renderCell(r,c){
            var cell=cells[r][c], t=board[r][c], mode=boardMode[r][c];
            cell.className='cell';
            var img=cell.querySelector('img'), nameEl=cell.querySelector('.cell-name');
            img.src=TYPES[t].img; img.alt=TYPES[t].name;
            nameEl.textContent=TYPES[t].name;
            nameEl.style.color=TYPES[t].color;
            var cellSize=boardEl.clientWidth/SIZE;
            nameEl.style.fontSize=Math.max(9,Math.round(cellSize*0.2))+'px';
            img.style.display=mode===0?'':'none';
            nameEl.style.display=mode===1?'block':'none';
        }
        function renderAll(){ for(var r=0;r<SIZE;r++) for(var c=0;c<SIZE;c++) renderCell(r,c); clearSel(); }
        function clearSel(){ if(selected){ cells[selected.r][selected.c].classList.remove('selected'); selected=null; } }
        function onDown(e){
            AudioFX.unlock();
            if(!running||busy) return;
            var cell=e.currentTarget, r=+cell.dataset.r, c=+cell.dataset.c;
            if(!selected){ selected={r:r,c:c}; cell.classList.add('selected'); AudioFX.select(); return; }
            if(selected.r===r&&selected.c===c){ clearSel(); AudioFX.select(); return; }
            var dr=Math.abs(selected.r-r), dc=Math.abs(selected.c-c);
            if(dr+dc===1){ var a={r:selected.r,c:selected.c}; clearSel(); trySwap(a,{r:r,c:c}); }
            else { clearSel(); selected={r:r,c:c}; cell.classList.add('selected'); AudioFX.select(); }
        }
        function trySwap(a,b){
            busy=true;
            var tmp=board[a.r][a.c]; board[a.r][a.c]=board[b.r][b.c]; board[b.r][b.c]=tmp;
            var tm=boardMode[a.r][a.c]; boardMode[a.r][a.c]=boardMode[b.r][b.c]; boardMode[b.r][b.c]=tm;
            renderAll(); AudioFX.swap();
            var m=findMatches();
            if(m.length===0){
                AudioFX.badSwap();
                cells[a.r][a.c].classList.add('flash-swap');
                cells[b.r][b.c].classList.add('flash-swap');
                setTimeout(function(){
                    tmp=board[a.r][a.c]; board[a.r][a.c]=board[b.r][b.c]; board[b.r][b.c]=tmp;
                    tm=boardMode[a.r][a.c]; boardMode[a.r][a.c]=boardMode[b.r][b.c]; boardMode[b.r][b.c]=tm;
                    renderAll(); busy=false;
                },220);
                return;
            }
            comboCount=0; resolveMatches();
        }
        function runMixed(r1,c1,r2,c2,isRow){
            var has0=false,has1=false;
            if(isRow){ for(var c=r1;c<c2;c++){ var m=boardMode[r1][c]; if(m===0)has0=true; else has1=true; } }
            else{ for(var r=r1;r<r2;r++){ var m=boardMode[r][c1]; if(m===0)has0=true; else has1=true; } }
            return has0&&has1;
        }
        function findMatches(){
            var matched=[];
            for(var r=0;r<SIZE;r++){ var rs=0;
                for(var c=1;c<=SIZE;c++){
                    if(c<SIZE && board[r][c]===board[r][rs]) continue;
                    var len=c-rs;
                    if(len>=3 && runMixed(r,rs,r,c,true)) for(var k=rs;k<c;k++) matched.push({r:r,c:k});
                    rs=c;
                }
            }
            for(var cc=0;cc<SIZE;cc++){ var rs2=0;
                for(var rr=1;rr<=SIZE;rr++){
                    if(rr<SIZE && board[rr][cc]===board[rs2][cc]) continue;
                    var len2=rr-rs2;
                    if(len2>=3 && runMixed(rs2,cc,rr,cc,false)) for(var k=rs2;k<rr;k++) matched.push({r:k,c:cc});
                    rs2=rr;
                }
            }
            return matched;
        }
        function hasAnyMove(){
            for(var r=0;r<SIZE;r++) for(var c=0;c<SIZE;c++){
                if(c+1<SIZE){
                    var t=board[r][c]; board[r][c]=board[r][c+1]; board[r][c+1]=t;
                    var tm=boardMode[r][c]; boardMode[r][c]=boardMode[r][c+1]; boardMode[r][c+1]=tm;
                    var m=findMatches();
                    t=board[r][c]; board[r][c]=board[r][c+1]; board[r][c+1]=t;
                    tm=boardMode[r][c]; boardMode[r][c]=boardMode[r][c+1]; boardMode[r][c+1]=tm;
                    if(m.length>0) return true;
                }
                if(r+1<SIZE){
                    var t2=board[r][c]; board[r][c]=board[r+1][c]; board[r+1][c]=t2;
                    var tm2=boardMode[r][c]; boardMode[r][c]=boardMode[r+1][c]; boardMode[r+1][c]=tm2;
                    var m2=findMatches();
                    t2=board[r][c]; board[r][c]=board[r+1][c]; board[r+1][c]=t2;
                    tm2=boardMode[r][c]; boardMode[r][c]=boardMode[r+1][c]; boardMode[r+1][c]=tm2;
                    if(m2.length>0) return true;
                }
            }
            return false;
        }
        function shuffleBoard(){ var g=0; do{ createBoard(); g++; }while(!hasAnyMove()&&g<50); forceSolvable(); renderAll(); }
        function showFloat(gained,combo){
            var el=document.createElement('div');
            el.className='float-score'; el.textContent=combo>1?'+'+gained+' 连消x'+combo:'+'+gained;
            el.style.left='50%'; el.style.top='42%';
            floatWrap.appendChild(el); setTimeout(function(){el.remove();},950);
        }
        function resolveMatches(){
            var matches=findMatches();
            if(matches.length===0){ busy=false;
                setTimeout(function(){ if(running&&!hasAnyMove()) shuffleBoard(); },60); return; }
            comboCount++;
            var seen={};
            matches.forEach(function(p){ var k=p.r+','+p.c; if(!seen[k]){seen[k]=true; cells[p.r][p.c].classList.add('removing');} });
            var uc=Object.keys(seen).length;
            var gained=uc*10+(comboCount-1)*50;
            score+=gained; scoreEl.textContent=score;
            AudioFX.match(comboCount); showFloat(gained,comboCount);
            if(opts.onScore) opts.onScore(score);
            setTimeout(function(){
                matches.forEach(function(p){ board[p.r][p.c]=-1; boardMode[p.r][p.c]=-1; });
                var fall=[];
                for(var c=0;c<SIZE;c++){ var write=SIZE-1;
                    for(var r=SIZE-1;r>=0;r--){ if(board[r][c]!==-1){
                        if(write!==r){ board[write][c]=board[r][c]; board[r][c]=-1;
                            boardMode[write][c]=boardMode[r][c]; boardMode[r][c]=-1; fall.push({fr:r,tr:write,c:c}); }
                        write--; } } }
                for(var cc=0;cc<SIZE;cc++) for(var rr=0;rr<SIZE;rr++) if(board[rr][cc]===-1){
                    board[rr][cc]=randType(); boardMode[rr][cc]=Math.random()<0.5?0:1; }
                renderAll();
                setTimeout(function(){ resolveMatches(); },330);
            },330);
        }
        function tick(now){
            var el=(now-startTs)/1000;
            timeLeft=Math.max(0,SECONDS-Math.floor(el));
            timeEl.textContent=timeLeft;
            timeEl.classList.toggle('urgent',timeLeft<=10);
            if(timeLeft!==lastTick && timeLeft<=10 && timeLeft>0) AudioFX.tick();
            lastTick=timeLeft;
            if(timeLeft<=0){ finish(); return; }
            rafId=requestAnimationFrame(tick);
        }
        function stopTimer(){ if(rafId) cancelAnimationFrame(rafId); rafId=null; }
        function finish(){
            stopTimer(); running=false; busy=false; clearSel();
            if(opts.onEnd) opts.onEnd(score);
        }
        return {
            start: function(){
                score=0; comboCount=0; selected=null; busy=false; running=true;
                scoreEl.textContent='0'; timeEl.textContent=SECONDS; timeEl.classList.remove('urgent');
                buildGrid(); createBoard();
                var g=0; while(!hasAnyMove()&&g<50){ createBoard(); g++; }
                forceSolvable();
                renderAll();
                startTs=performance.now(); lastTick=-1;
                rafId=requestAnimationFrame(tick);
            },
            stop: function(){ stopTimer(); running=false; busy=false; },
            getScore: function(){ return score; },
            getTimeLeft: function(){ return timeLeft; }
        };
    }

    /* ===== 视图控制 ===== */
    var levelView=document.getElementById('levelView');
    var gameView=document.getElementById('gameView');
    var levelGrid=document.getElementById('levelGrid');
    var boardWrap=document.getElementById('boardWrap');
    var gameTitle=document.getElementById('gameTitle');
    var gameSub=document.getElementById('gameSub');
    var endOverlay=document.getElementById('endOverlay');
    var endTitle=document.getElementById('endTitle');
    var endSub=document.getElementById('endSub');
    var endScoreEl=document.getElementById('endScore');
    var endTargetEl=document.getElementById('endTarget');
    var endBestEl=document.getElementById('endBest');
    var endVerdictEl=document.getElementById('endVerdict');
    var endTrophy=document.getElementById('endTrophy');
    var nextBtn=document.getElementById('nextBtn');
    var againBtn=document.getElementById('againBtn');
    var closeBtn=document.getElementById('closeBtn');
    var soundBtn=document.getElementById('soundBtn');
    var wavePath=document.getElementById('wavePath');
    var legendEl=document.getElementById('legend');

    var currentLevel=0, isPk=false, game1=null, game2=null;

    function setGameMode(pk){
        isPk=pk;
        document.getElementById('modeSingleBtn').classList.toggle('active',!pk);
        document.getElementById('modePkBtn').classList.toggle('active',pk);
    }
    window.setGameMode=setGameMode;

    function tryFullscreen(){
        var el=document.documentElement;
        try{ if(el.requestFullscreen){var p=el.requestFullscreen(); if(p&&p.catch)p.catch(function(){});}
        else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen(); }catch(e){}
    }

    function renderLevelCards(){
        levelGrid.innerHTML='';
        LEVELS.forEach(function(conf,i){
            var card=document.createElement('div');
            card.className='level-card '+conf.cls;
            var num=document.createElement('div'); num.className='lv-num'; num.textContent='第'+(i+1)+'关';
            var size=document.createElement('div'); size.className='lv-size'; size.textContent=conf.size+' × '+conf.size;
            var meta=document.createElement('div'); meta.className='lv-meta';
            meta.innerHTML='限时 <b>'+conf.seconds+' 秒</b> · 目标 <b>'+conf.target+' 分</b>';
            var bl=document.createElement('div'); bl.className='lv-best'; bl.textContent='最高 '+loadBest(i)+' 分';
            var cl=document.createElement('div'); cl.className='lv-cleared'+(isCleared(i)?' show':'');
            card.appendChild(num); card.appendChild(size); card.appendChild(meta); card.appendChild(bl); card.appendChild(cl);
            levelGrid.appendChild(card);
            card.addEventListener('click',function(){ AudioFX.unlock(); tryFullscreen(); startLevel(i); });
        });
    }

    function startLevel(lv){
        currentLevel=lv;
        var conf=LEVELS[lv];
        gameTitle.textContent=conf.label;
        gameSub.textContent=conf.size+' × '+conf.size+' · '+conf.seconds+' 秒';
        endOverlay.classList.remove('show');
        levelView.classList.remove('active');
        gameView.classList.add('active');

        if(game1){ game1.stop(); }
        boardWrap.innerHTML='';

        if(!isPk){
            var panel=document.createElement('div');
            panel.className='board-wrap'; panel.style.width='min(94vw,660px)'; panel.style.margin='0 auto';
            boardWrap.appendChild(panel);
            var best=loadBest(lv);
            game1=createGame(panel,{size:conf.size,seconds:conf.seconds,target:conf.target,
                onEnd:function(score){
                    if(score>best){best=score; saveBest(lv,best);}
                    var won=score>=conf.target;
                    endScoreEl.textContent=score;
                    endTargetEl.textContent=conf.target;
                    endBestEl.textContent=loadBest(lv);
                    if(won){ setCleared(lv); AudioFX.win(); endTrophy.className='trophy win';
                        endTitle.textContent=lv===LEVELS.length-1?'全部通关！':'通关！';
                        endSub.textContent='达标得分，'+conf.label;
                        var ratio=score/conf.target;
                        endVerdictEl.textContent=ratio>=1.6?'完美表现，仪器大师当之无愧！':(ratio>=1.2?'轻松达标，继续保持！':'刚好通关，再练一局冲高分！');
                        endVerdictEl.className='verdict win';
                        nextBtn.style.display=lv<LEVELS.length-1?'':'none';
                    } else { AudioFX.fail(); endTrophy.className='trophy fail';
                        endTitle.textContent='还差一点'; endSub.textContent='未达目标分，再来一次';
                        endVerdictEl.textContent='距通关还差 '+(conf.target-score)+' 分，继续加油！';
                        endVerdictEl.className='verdict fail'; nextBtn.style.display='none'; }
                    renderLevelCards(); endOverlay.classList.add('show');
                }});
            game1.start();
        } else {
            /* 双人 PK */
            var wrap=document.createElement('div'); wrap.className='pk-wrap';
            var p1=document.createElement('div'); p1.className='pk-panel p1';
            p1.innerHTML='<div class="panel-title">🔵 玩家 1</div>';
            var p2=document.createElement('div'); p2.className='pk-panel p2';
            p2.innerHTML='<div class="panel-title">🔴 玩家 2</div>';
            wrap.appendChild(p1); wrap.appendChild(p2);
            boardWrap.appendChild(wrap);
            var doneCount=0, s1=0, s2=0;
            function pkEnd(who){
                return function(score){
                    if(who===1) s1=score; else s2=score;
                    doneCount++;
                    if(doneCount<2) return;
                    game1.stop(); game2.stop();
                    var winText = s1===s2 ? '平局！'+s1+' : '+s2 : (s1>s2?'🔵 玩家1 获胜！':'🔴 玩家2 获胜！');
                    endTrophy.className='trophy '+(s1===s2?'win':(s1>s2?'win':'fail'));
                    endTitle.textContent='PK 结束';
                    endSub.textContent=conf.label;
                    endScoreEl.textContent=s1+' : '+s2;
                    endTargetEl.textContent=conf.target;
                    endBestEl.textContent='—';
                    endVerdictEl.textContent=winText;
                    endVerdictEl.className='verdict win';
                    nextBtn.style.display='none';
                    if(s1>s2||s2>s1) AudioFX.win();
                    else AudioFX.fail();
                    endOverlay.classList.add('show');
                };
            }
            game1=createGame(p1,{size:conf.size,seconds:conf.seconds,target:conf.target,onEnd:pkEnd(1)});
            game2=createGame(p2,{size:conf.size,seconds:conf.seconds,target:conf.target,onEnd:pkEnd(2)});
            game1.start(); game2.start();
        }
    }

    function backToLevels(){
        if(game1) game1.stop(); if(game2) game2.stop();
        endOverlay.classList.remove('show');
        gameView.classList.remove('active');
        levelView.classList.add('active');
        renderLevelCards();
    }

    soundBtn.addEventListener('click',function(){
        AudioFX.unlock(); AudioFX.setMuted(!AudioFX.isMuted());
        if(AudioFX.isMuted()) wavePath.setAttribute('d','M16 9l5 6M21 9l-5 6');
        else wavePath.setAttribute('d','M15.5 8.5a5 5 0 0 1 0 7');
    });
    document.getElementById('restartBtn').addEventListener('click',function(){AudioFX.unlock();startLevel(currentLevel);});
    againBtn.addEventListener('click',function(){AudioFX.unlock();startLevel(currentLevel);});
    nextBtn.addEventListener('click',function(){ if(currentLevel<LEVELS.length-1) startLevel(currentLevel+1); });
    closeBtn.addEventListener('click',backToLevels);
    document.getElementById('backBtn').addEventListener('click',backToLevels);

    renderLevelCards();

    document.addEventListener('pointerdown',function firstTap(){ tryFullscreen(); document.removeEventListener('pointerdown',firstTap); },{passive:true});
})();

/* 禁止鼠标右键：点击右键时页面无任何变化、不弹菜单 */
document.addEventListener('contextmenu', function (e) {
    e.preventDefault();
    return false;
});
</script>
</body>
</html>
