<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>化学仪器连连看</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
    --bg-0: #0f172a;
    --bg-1: #1e293b;
    --cell-bg: #f8fafc;
    --cell-border: rgba(148, 163, 184, 0.35);
    --accent: #f59e0b;
    --accent-2: #38bdf8;
    --text-main: #f1f5f9;
    --text-sub: #94a3b8;
    --danger: #ef4444;
    --ok: #22c55e;
    --text-gap: 2px;
}
html, body { height: 100%; }
body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, sans-serif;
    background:
        radial-gradient(1200px 600px at 15% -10%, rgba(56, 189, 248, 0.12), transparent 60%),
        radial-gradient(1000px 700px at 110% 10%, rgba(245, 158, 11, 0.10), transparent 55%),
        linear-gradient(160deg, var(--bg-0) 0%, var(--bg-1) 100%);
    background-attachment: fixed;
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 14px 10px 24px;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    overflow-x: hidden;
}
.view { display: none; width: 100%; flex-direction: column; align-items: center; }
.view.active { display: flex; }
/* ===== 顶栏（游戏视图） ===== */
.topbar {
    width: min(94vw, 720px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 10px;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand .logo {
    width: 38px; height: 38px; border-radius: 10px;
    background: linear-gradient(135deg, #38bdf8, #6366f1);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(56, 189, 248, 0.35);
}
.brand h1 {
    font-size: 20px; font-weight: 800; letter-spacing: 1px;
    background: linear-gradient(90deg, #e2e8f0, #bae6fd);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    white-space: nowrap;
}
.brand small { display: block; font-size: 10px; font-weight: 500; color: var(--text-sub); letter-spacing: 0; -webkit-text-fill-color: var(--text-sub); }
.stats { display: flex; align-items: stretch; gap: 8px; flex-wrap: wrap; }
.stat-card {
    background: rgba(15, 23, 42, 0.65); border: 1px solid rgba(148, 163, 184, 0.25);
    border-radius: 12px; padding: 6px 13px; text-align: center; min-width: 78px;
    backdrop-filter: blur(4px);
}
.stat-card .label { font-size: 10px; color: var(--text-sub); letter-spacing: 1px; margin-bottom: 2px; }
.stat-card .value { font-size: 21px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat-card .value.score { color: var(--accent); }
.stat-card .value.best { color: var(--accent-2); }
.stat-card .value.time { color: var(--ok); }
.stat-card .value.time.urgent { color: var(--danger); animation: blink 0.6s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0.35; } }
.stat-card .value.target { color: #e2e8f0; font-size: 16px; padding-top: 3px; }
.controls { display: flex; gap: 6px; }
.ctrl-btn {
    width: 42px; height: 42px; border-radius: 12px;
    border: 1px solid rgba(148, 163, 184, 0.3);
    background: rgba(15, 23, 42, 0.65); color: var(--text-main);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: transform 0.15s ease, background 0.2s ease; backdrop-filter: blur(4px);
}
.ctrl-btn:hover { background: rgba(51, 65, 85, 0.8); transform: translateY(-2px); }
.ctrl-btn:active { transform: scale(0.92); }
.ctrl-btn svg { width: 20px; height: 20px; }
.ctrl-btn.restart { border-color: rgba(245, 158, 11, 0.5); }
.ctrl-btn.restart svg { stroke: var(--accent); }
.ctrl-btn.back { border-color: rgba(56, 189, 248, 0.4); }
.ctrl-btn.back svg { stroke: var(--accent-2); }
.ctrl-btn.practice-on{ border-color:#22c55e; background:rgba(34,197,94,0.2); }
.ctrl-btn.demo-on{ border-color:#8b5cf6; background:rgba(139,92,246,0.2); }
/* ===== 提示条 ===== */
.hintbar {
    width: min(94vw, 720px); display: flex; align-items: center; justify-content: flex-end;
    gap: 8px; margin-bottom: 10px; font-size: 12px; color: var(--text-sub);
}
.toast {
    background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(245, 158, 11, 0.5);
    color: var(--accent); padding: 4px 12px; border-radius: 20px; font-size: 12px;
    font-weight: 600; opacity: 0; transform: translateY(-4px);
    transition: opacity 0.25s ease, transform 0.25s ease; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }
/* ===== 棋盘 ===== */
.board-wrap { position: relative; width: min(94vw, 660px); }
#board {
    display: grid;
    gap: 3px;
    padding: 8px;
    background: rgba(15, 23, 42, 0.55);
    border: 1px solid rgba(148, 163, 184, 0.22);
    border-radius: 14px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255,255,255,0.06);
    backdrop-filter: blur(4px);
}
.cell {
    position: relative; aspect-ratio: 1 / 1;
    background: linear-gradient(145deg, #ffffff, var(--cell-bg));
    border-radius: 5px; border: 1px solid var(--cell-border);
    overflow: hidden; cursor: pointer; touch-action: manipulation;
    transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.18s ease;
    display: flex; align-items: center; justify-content: center;
    padding: 8px;
}
.cell:hover { transform: scale(1.04); z-index: 2; }
.cell img {
    width: 100%; height: 100%; object-fit: contain; pointer-events: none; -webkit-user-drag: none; transition: transform 0.2s ease;
}
.cell .cell-name {
    display: none;
    font-weight: 800;
    pointer-events: none;
    max-width: 94%;
    max-height:94%;
    justify-items:center;
    align-items:center;
    justify-content:center;
    align-content:center;
}
/* 2字：单行flex */
.cell .cell-name.single-row{
    display:flex;
    flex-wrap:nowrap;
    flex-direction:row;
    gap:var(--text-gap);
    align-items:center;
    justify-content:center;
}
/* 3个字：第1行2字，第2行1字，整体居中 */
.cell .cell-name.three-row{
    display:flex;
    flex-direction:column;
    gap:var(--text-gap);
    align-items:center;
    justify-content:center;
}
.cell .cell-name.three-row .line{
    display:flex;
    flex-direction:row;
    gap:var(--text-gap);
    justify-content:center;
}
/* 4字专用：严格2行2列 */
.cell .cell-name.grid-four{
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:auto auto;
    gap:var(--text-gap) var(--text-gap);
    justify-items:center;
    align-items:center;
}
.cell.selected {
    outline: 2.5px solid var(--accent); outline-offset: -2.5px;
    box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.3), 0 6px 16px rgba(0,0,0,0.35);
    transform: scale(1.07); z-index: 3;
}
.cell.removed {
    background: rgba(30,41,59,0.2);
    border-color: rgba(148,163,184,0.1);
    pointer-events: none;
}
.cell.removed img, .cell.removed .cell-name {
    opacity:0;
}
@keyframes pop {
    0% { transform: scale(1); opacity: 1; }
    35% { transform: scale(1.22) rotate(6deg); opacity: 1; }
    100% { transform: scale(0); opacity: 0; }
}
.float-score {
    position: absolute; z-index: 10; font-weight: 900; font-size: 17px; color: var(--accent);
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6); pointer-events: none;
    animation: floatUp 0.9s ease forwards; transform: translate(-50%, -50%);
}
@keyframes floatUp {
    0% { opacity: 0; scale: 0.6; }
    20% { opacity: 1; scale: 1.15; }
    100% { opacity: 0; scale: 1; transform: translate(-50%, -140%); }
}
/* ===== 关卡选择视图 ===== */
.level-head { text-align: center; margin: 6vh 0 4vh; }
.level-head .logo {
    width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 18px;
    background: linear-gradient(135deg, #38bdf8, #6366f1);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 12px 32px rgba(56, 189, 248, 0.4);
}
.level-head h1 { font-size: 28px; font-weight: 900; letter-spacing: 2px; margin-bottom: 6px; }
.level-head p { color: var(--text-sub); font-size: 14px; }
.level-grid {
    width: min(94vw, 800px);
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
}
.level-card {
    background: linear-gradient(160deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.9));
    border: 1px solid rgba(148, 163, 184, 0.25);
    border-radius: 18px;
    padding: 22px 16px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.25s ease, border-color 0.2s ease;
    position: relative;
}
.level-card:hover { transform: translateY(-5px); box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45); border-color: rgba(245, 158, 11, 0.6); }
.level-card .lv-num {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 6px 12px; min-width: 40px; height: 34px; border-radius: 12px; margin-bottom: 10px;
    font-size: 15px; font-weight: 900; white-space: nowrap;
}
.level-card.lv1 .lv-num { background: rgba(34, 197, 94, 0.18); color: #4ade80; }
.level-card.lv2 .lv-num { background: rgba(56, 189, 248, 0.18); color: #38bdf8; }
.level-card.lv3 .lv-num { background: rgba(245, 158, 11, 0.18); color: #fbbf24; }
.level-card.lv4 .lv-num { background: rgba(239, 68, 68, 0.18); color: #f87171; }
.level-card.lv5 .lv-num { background: rgba(139, 92, 246, 0.18); color: #c4b5fd; }
.level-card .lv-size { font-size: 22px; font-weight: 900; margin-bottom: 4px; }
.level-card .lv-title {
    display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-size: 14px; font-weight: 700; margin-bottom: 2px;
}
.level-card .lv-meta { font-size: 12px; color: var(--text-sub); line-height: 1.8; margin-bottom: 10px; }
.level-card .lv-meta b { color: #e2e8f0; }
.level-card .lv-best {
    font-size: 12px; padding: 5px 10px; border-radius: 20px;
    background: rgba(56, 189, 248, 0.12); color: #7dd3fc;
    display: inline-block;
}
.level-card .lv-cleared {
    position: absolute; top: 12px; right: 12px;
    width: 26px; height: 26px; border-radius: 50%;
    background: linear-gradient(135deg, #22c55e, #16a34a);
    display: none; align-items: center; justify-content: center;
    box-shadow: 0 4px 12px rgba(34, 197, 94, 0.4);
}
.level-card .lv-cleared.show { display: flex; }
.level-card .lv-cleared svg { width: 14px; height: 14px; stroke: #fff; }

/* =====首页游戏规则说明区块===== */
.rule-wrap{
    width: min(94vw,800px);
    margin-top:36px;
    background:rgba(30,41,59,0.6);
    border:1px solid rgba(148,163,184,0.24);
    border-radius:16px;
    padding:20px 24px;
    backdrop-filter: blur(4px);
}
.rule-wrap h3{
    font-size:18px;
    margin-bottom:12px;
    color:#bae6fd;
}
.rule-wrap ul{
    padding-left:20px;
}
.rule-wrap li{
    font-size:14px;
    color:#cbd5e1;
    line-height:1.7;
    margin-bottom:6px;
}

/* ===== 结束面板 ===== */
.overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(2, 6, 23, 0.72); backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center; padding: 20px;
}
.overlay.show { display: flex; }
.end-card {
    background: linear-gradient(160deg, #1e293b, #0f172a);
    border: 1px solid rgba(148, 163, 184, 0.3);
    border-radius: 20px; padding: 30px 34px; text-align: center;
    max-width: 420px; width: 100%;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
    animation: cardIn 0.4s cubic-bezier(0.2, 1.2, 0.35, 1);
}
@keyframes cardIn { from { opacity: 0; transform: translateY(30px) scale(0.9); } to { opacity: 1; transform: translateY(0) scale(1); } }
.end-card .trophy {
    width: 64px; height: 64px; margin: 0 auto 12px; border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
}
.end-card .trophy.win { background: linear-gradient(135deg, #f59e0b, #fbbf24); box-shadow: 0 10px 28px rgba(245, 158, 11, 0.4); }
.end-card .trophy.fail { background: linear-gradient(135deg, #475569, #334155); box-shadow: 0 10px 28px rgba(51, 65, 85, 0.4); }
.end-card .trophy svg { width: 34px; height: 34px; }
.end-card .trophy.win svg { stroke: #78350f; }
.end-card .trophy.fail svg { stroke: #cbd5e1; }
.end-card h2 { font-size: 24px; font-weight: 800; margin-bottom: 4px; }
.end-card .sub { color: var(--text-sub); font-size: 13px; margin-bottom: 16px; }
.end-card .big-score { font-size: 50px; font-weight: 900; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1; margin-bottom: 4px; }
.end-card .target-line { color: var(--text-sub); font-size: 13px; margin-bottom: 6px; }
.end-card .target-line b { color: #e2e8f0; }
.end-card .best-line { color: var(--text-sub); font-size: 13px; margin-bottom: 8px; }
.end-card .best-line b { color: var(--accent-2); }
.end-card .verdict {
    font-size: 14px; padding: 10px 16px; border-radius: 12px; margin: 14px 0 20px;
    border: 1px solid;
}
.end-card .verdict.win { background: rgba(34, 197, 94, 0.12); color: #86efac; border-color: rgba(34, 197, 94, 0.3); }
.end-card .verdict.fail { background: rgba(245, 158, 11, 0.12); color: #fcd34d; border-color: rgba(245, 158, 11, 0.3); }
.end-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.end-actions button {
    padding: 12px 22px; border: none; border-radius: 14px; font-size: 14px; font-weight: 700;
    font-family: inherit; cursor: pointer; transition: transform 0.15s ease, box-shadow 0.2s ease;
}
.end-actions button:hover { transform: translateY(-2px); }
.end-actions .again { background: linear-gradient(135deg, #f59e0b, #d97706); color: #1c1917; box-shadow: 0 8px 20px rgba(245, 158, 11, 0.35); }
.end-actions .next { background: linear-gradient(135deg, #22c55e, #16a34a); color: #052e16; box-shadow: 0 8px 20px rgba(34, 197, 94, 0.35); }
.end-actions .level-btn { background: rgba(51, 65, 85, 0.7); color: var(--text-main); border: 1px solid rgba(148, 163, 184, 0.3); }
/* ===== 响应式 ===== */
@media (max-width: 640px) {
    .level-grid { grid-template-columns: repeat(2, 1fr); }
    .level-head h1 { font-size: 23px; }
    .brand h1 { font-size: 17px; }
    .stat-card { min-width: 66px; padding: 5px 9px; }
    .stat-card .value { font-size: 17px; }
    #board { gap: 2px; padding: 6px; }
    .cell { border-radius: 4px; padding:4px; }
    .rule-wrap{padding:16px 18px;margin-top:28px;}
}
</style>
</head>
<body>
<!-- ===== 关卡选择视图 ===== -->
<div class="view active" id="levelView">
    <div class="level-head">
        <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="32" height="32">
                <path d="M9 3h6"></path>
                <path d="M10.5 3v5.2L5.6 17.4a2.1 2.1 0 0 0 1.8 3.2h9.2a2.1 2.1 0 0 0 1.8-3.2L13.5 8.2V3"></path>
            </svg>
        </div>
        <h1>化学仪器连连看</h1>
        <p>图片与仪器名称配对消除 · 不受路径限制</p>
    </div>
    <div class="level-grid" id="levelGrid"></div>
    <!-- 首页游戏规则说明 -->
    <div class="rule-wrap">
        <h3>📖 游戏规则</h3>
        <ul>
            <li>棋盘内分为仪器图片格子、仪器名称格子两种；</li>
            <li>只要是<strong>同一种仪器：一张图片 + 一个名称</strong>，即可直接配对消除，不受位置、阻挡、拐点限制；</li>
            <li>图片配图片、名称配名称无法消除；</li>
            <li>快速连续配对可获得连击加分；棋盘没有可配对组合时会自动重新打乱。</li>
         </ul>
    </div>
</div>
<!-- ===== 游戏视图 ===== -->
<div class="view" id="gameView">
    <div class="topbar">
        <div class="brand">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22">
                    <path d="M9 3h6"></path>
                    <path d="M10.5 3v5.2L5.6 17.4a2.1 2.1 0 0 0 1.8 3.2h9.2a2.1 2.1 0 0 0 1.8-3.2L13.5 8.2V3"></path>
                </svg>
            </div>
            <h1 id="gameTitle">第 1 关<small id="gameSub">4 × 4 · 40 秒</small></h1>
        </div>
        <div class="stats">
            <div class="stat-card"><div class="label">得分</div><div class="value score" id="scoreVal">0</div></div>
            <div class="stat-card"><div class="label">目标</div><div class="value target" id="targetVal">120</div></div>
            <div class="stat-card"><div class="label">最高</div><div class="value best" id="bestVal">0</div></div>
            <div class="stat-card"><div class="label">剩余</div><div class="value time" id="timeVal">40</div></div>
        </div>
        <div class="controls">
            <button class="ctrl-btn back" id="backBtn" title="返回关卡选择" aria-label="返回关卡选择">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5"></path><path d="M12 19l-7-7 7-7"></path>
                </svg>
            </button>
            <button class="ctrl-btn" id="practiceBtn" title="练习模式（关闭倒计时）" aria-label="练习模式">
                <svg viewBox="0 0 24 24" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M12 8v4l3 3"></path>
                </svg>
            </button>
            <button class="ctrl-btn" id="demoBtn" title="教学演示切换：混合/只看名称/只看图片" aria-label="教学演示">
                <svg viewBox="0 0 24 24" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            </button>
            <button class="ctrl-btn" id="soundBtn" title="音效开关" aria-label="音效开关">
                <svg viewBox="0 0 24 24" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 5 6 9H2v6h4l5 4V5z"></path>
                    <path id="wavePath" d="M15.5 8.5a5 5 0 0 1 0 7"></path>
                </svg>
            </button>
            <button class="ctrl-btn restart" id="restartBtn" title="再来一次" aria-label="再来一次">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
                    <path d="M21 3v6h-6"></path>
                </svg>
            </button>
        </div>
    </div>
    <div class="hintbar">
        <div class="toast" id="toast"></div>
    </div>
    <div class="board-wrap">
        <div id="board" role="grid" aria-label="连连看棋盘"></div>
    </div>
</div>
<!-- ===== 结束面板 ===== -->
<div class="overlay" id="endOverlay">
    <div class="end-card">
        <div class="trophy win" id="endTrophy">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M8 21h8"></path><path d="M12 17v4"></path>
                <path d="M7 4h10v6a5 5 0 0 1-10 0V4z"></path>
                <path d="M7 6H4a2 2 0 0 0 2 4h1"></path>
                <path d="M17 6h3a2 2 0 0 1-2 4h-1"></path>
            </svg>
        </div>
        <h2 id="endTitle">通关！</h2>
        <div class="sub" id="endSub">本关得分</div>
        <div class="big-score" id="endScore">0</div>
        <div class="target-line">目标 <b id="endTarget">120</b> · 本关最高 <b id="endBest">0</b></div>
        <div class="verdict win" id="endVerdict">完美通关！</div>
        <div class="end-actions">
            <button class="next" id="nextBtn">下一关</button>
            <button class="again" id="againBtn">再来一次</button>
            <button class="level-btn" id="closeBtn">返回关卡</button>
        </div>
    </div>
</div>
<script>
(function () {
    'use strict';
    /* ===== 仪器素材 ===== */
    var TYPES = [

    /* ===== localStorage存取 ===== */
    function keyBest(lv) { return 'chemLinkBest_' + lv; }
    function keyCleared(lv) { return 'chemLinkCleared_' + lv; }
    function loadBest(lv) {
        try {
            var v = parseInt(localStorage.getItem(keyBest(lv)) || '0', 10);
            return isNaN(v) ? 0 : v;
        } catch (e) { return 0; }
    }
    function saveBest(lv, v) {
        try { localStorage.setItem(keyBest(lv), String(v)); } catch (e) {}
    }
    function isCleared(lv) {
        try { return localStorage.getItem(keyCleared(lv)) === '1'; } catch (e) { return false; }
    }
    function setCleared(lv) {
        try { localStorage.setItem(keyCleared(lv), '1'); } catch (e) {}
    }
    /* ===== 音效 ===== */
    var AudioFX = (function () {
        var ctx = null;
        var muted = false;
        function ensure() {
            if (!ctx) {
                var AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return null;
                ctx = new AC();
            }
            if (ctx.state === 'suspended') ctx.resume();
            return ctx;
        }
        function tone(freq, dur, type, vol, delay, slideTo) {
            if (muted) return;
            var c = ensure();
            if (!c) return;
            var t0 = c.currentTime + (delay || 0);
            var osc = c.createOscillator();
            var gain = c.createGain();
            osc.type = type || 'sine';
            osc.frequency.setValueAtTime(freq, t0);
            if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
            var v = vol || 0.16;
            gain.gain.setValueAtTime(0.0001, t0);
            gain.gain.exponentialRampToValueAtTime(v, t0 + 0.012);
            gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
            osc.connect(gain);
            gain.connect(c.destination);
            osc.start(t0);
            osc.stop(t0 + dur + 0.05);
        }
        return {
            unlock: function () { ensure(); },
            setMuted: function (m) { muted = m; },
            isMuted: function () { return muted; },
            select: function () { tone(660, 0.06, 'triangle', 0.10); },
            bad: function () { tone(200, 0.18, 'sawtooth', 0.06, 0, 140); },
            match: function (combo) {
                var base = [523.25, 659.25, 783.99, 1046.5];
                var n = Math.min(combo,3);
                for(var i=0;i<3;i++){
                    tone(base[i]*Math.pow(1.12,n),0.13,'triangle',0.14,i*0.055);
                }
                if(combo>1) tone(base[3]*Math.pow(1.1,n),0.2,'sine',0.12,0.16);
            },
            win: function () {
                var seq = [523.25,659.25,783.99,1046.5];
                for(var i=0;i<seq.length;i++) tone(seq[i],0.2,'triangle',0.15,i*0.12);
            },
            fail: function () {
                var seq = [392,329.63,261.63];
                for(var i=0;i<seq.length;i++) tone(seq[i],0.2,'triangle',0.13,i*0.14);
            },
            tick: function () { tone(880, 0.05, 'square', 0.05); }
        };
    })();
    function setMutedUI(m) {
        if (m) wavePath.setAttribute('d', 'M16 9l5 6M21 9l-5 6');
        else wavePath.setAttribute('d', 'M15.5 8.5a5 5 0 0 1 0 7');
    }

    demoBtn.addEventListener('click',function(){

        showToast(demoText[demoMode]);

    });
    /* ===== 生成棋盘 ===== */
    function createBoard() {
        board = [];
        boardMode = [];
        for(var r=0;r<SIZE;r++){
            board[r]=[];
            boardMode[r]=[];
            for(var c=0;c<SIZE;c++){
                board[r][c]=-1;
                boardMode[r][c]=0;
            }
        }
        var pairsNeeded = TOTAL_PAIRS;
        var pool = [];
        for(var i=0;i<pairsNeeded;i++){
            var tid = i % TYPES.length;
            pool.push({tid:tid,mode:0});
            pool.push({tid:tid,mode:1});
        }
        for(var i=pool.length-1;i>0;i--){
            var j = Math.floor(Math.random()*(i+1));
            var tmp = pool[i]; pool[i]=pool[j]; pool[j]=tmp;
        }
        var ptr=0;
        for(var r=0;r<SIZE && ptr<pool.length;r++){
            for(var c=0;c<SIZE && ptr<pool.length;c++){
                var item = pool[ptr++];
                board[r][c] = item.tid;
                boardMode[r][c] = item.mode;
            }
        }
    }
    var cells = [];
    function buildGrid() {
        boardEl.style.gridTemplateColumns = 'repeat(' + SIZE + ', 1fr)';
        boardEl.innerHTML = '';
        cells = [];
        for (var r = 0; r < SIZE; r++) {
            cells[r] = [];
            for (var c = 0; c < SIZE; c++) {
                var cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.r = r;
                cell.dataset.c = c;
                var img = document.createElement('img');
                img.alt = '';
                img.draggable = false;
                var nameEl = document.createElement('div');
                nameEl.className = 'cell-name';
                cell.appendChild(img);
                cell.appendChild(nameEl);
                boardEl.appendChild(cell);
                cells[r][c] = cell;
                cell.addEventListener('pointerdown', function (e) {
                    e.preventDefault();
                    onCellPointerDown(e);
                });
            }
        }
    }
    function renderCell(r, c) {
        var cell = cells[r][c];
        var t = board[r][c];
        var mode = boardMode[r][c];
        cell.className = 'cell';
        var img = cell.querySelector('img');
        var nameEl = cell.querySelector('.cell-name');
        if(t === -1){
            cell.classList.add('removed');
            img.style.display='none';
            nameEl.style.display='none';
            return;
        }
        var typeObj = TYPES[t];
        img.src = typeObj.img;
        img.alt = typeObj.name;
        nameEl.style.color = typeObj.color;
        var cellPxSize = cell.clientWidth;
        var fontSize = Math.max(9, Math.min(Math.round(cellPxSize * 0.32),42));
        nameEl.style.fontSize = fontSize + "px";
        var nameStr = typeObj.name;
        nameEl.innerHTML = "";
        if(nameStr.length === 4){
            //4字：2行2列 胶头｜滴管
            nameEl.className = "cell-name grid-four";
            var s0 = document.createElement("span");s0.textContent=nameStr[0];
            var s1 = document.createElement("span");s1.textContent=nameStr[1];
            var s2 = document.createElement("span");s2.textContent=nameStr[2];
            var s3 = document.createElement("span");s3.textContent=nameStr[3];
            nameEl.appendChild(s0);nameEl.appendChild(s1);
            nameEl.appendChild(s2);nameEl.appendChild(s3);
        }else if(nameStr.length ===3){
            //3个字：第1行2字，第2行1字，整体居中
            nameEl.className = "cell-name three-row";
            var line1 = document.createElement("div");
            line1.className="line";
            var l1ch0 = document.createElement("span"); l1ch0.textContent=nameStr[0];
            var l1ch1 = document.createElement("span"); l1ch1.textContent=nameStr[1];
            line1.appendChild(l1ch0); line1.appendChild(l1ch1);

            var line2 = document.createElement("div");
            line2.className="line";
            var l2ch0 = document.createElement("span"); l2ch0.textContent=nameStr[2];
            line2.appendChild(l2ch0);

            nameEl.appendChild(line1);
            nameEl.appendChild(line2);
        }else{
            //2个字单行
            nameEl.className = "cell-name single-row";
            for(var ch of nameStr){
                var sp = document.createElement("span");
                sp.textContent = ch;
                nameEl.appendChild(sp);
            }
        }
        //演示模式逻辑
        if(demoMode===0){
            //正常混合，沿用原始mode
            if(mode ===0){
                img.style.display = '';
                nameEl.style.display = 'none';
            }else{
                img.style.display = 'none';
                nameEl.style.display = '';
            }
        }else if(demoMode===1){
            //只看名称，全部显示文字，隐藏图片
            img.style.display = 'none';
            nameEl.style.display = '';
        }else if(demoMode===2){
            //只看图片，全部显示图片，隐藏文字
            img.style.display = '';
            nameEl.style.display = 'none';
        }
    }
    function renderAll() {
        for (var r = 0; r < SIZE; r++) {
            for (var c = 0; c < SIZE; c++) {
                renderCell(r, c);
            }
        }
        clearSelection();
    }
    function clearSelection() {
        if (selected) {
            cells[selected.r][selected.c].classList.remove('selected');
            selected = null;
        }
    }
    /* ===== 交互：取消路径连通判断，只校验仪器ID与模式不同 ===== */
    function onCellPointerDown(e) {
        AudioFX.unlock();
        if (!running || busy) return;
        var cell = e.currentTarget;
        var r = parseInt(cell.dataset.r, 10);
        var c = parseInt(cell.dataset.c, 10);
        if(board[r][c]===-1) return;
        if (!selected) {
            selected = { r: r, c: c };
            cell.classList.add('selected');
            AudioFX.select();
            return;
        }
        if (selected.r === r && selected.c === c) {
            clearSelection();
            AudioFX.select();
            return;
        }
        var pA={r:selected.r,c:selected.c};
        var pB={r:r,c:c};
        var tA=board[pA.r][pA.c];
        var tB=board[pB.r][pB.c];
        var mA=boardMode[pA.r][pA.c];
        var mB=boardMode[pB.r][pB.c];
        // 规则：仪器ID相同，一个图片模式、一个文字模式，直接消除，不需要路径连通
        if(tA===tB && mA!==mB){
            busy=true;
            comboCount++;
            var baseScore=20;
            var bonus = (comboCount-1)*15;
            var gain = baseScore+bonus;
            score+=gain;
            clearedPairs++;
            showFloatScore(gain,comboCount);
            AudioFX.match(comboCount);
            cells[pA.r][pA.c].classList.add('pop');
            cells[pB.r][pB.c].classList.add('pop');
            updateScoreUI();
            setTimeout(function(){
                board[pA.r][pA.c]=-1;
                board[pB.r][pB.c]=-1;
                renderAll();
                busy=false;
                if(clearedPairs >= TOTAL_PAIRS){
                    endGame();
                }else if(!hasValidPair()){
                    showToast('没有可配对，重新打乱棋盘');
                    shuffleBoard();
                }
            },320);
        }else{
            AudioFX.bad();
            showToast('不能配对，请选择【同仪器：图片 + 名称】');
        }
        clearSelection();
    }
    function hasValidPair(){
        for(var r1=0;r1<SIZE;r1++){
            for(var c1=0;c1<SIZE;c1++){
                var t1=board[r1][c1];
                if(t1===-1) continue;
                var m1=boardMode[r1][c1];
                for(var r2=0;r2<SIZE;r2++){
                    for(var c2=0;c2<SIZE;c2++){
                        var t2=board[r2][c2];
                        if(t2===-1) continue;
                        if(r1===r2&&c1===c2) continue;
                        var m2=boardMode[r2][c2];
                        if(t1===t2 && m1!==m2){
                            return true;
                        }
                    }
                }
            }
        }
        return false;
    }
    function shuffleBoard(){
        clearedPairs=0;
        createBoard();
        while(!hasValidPair()){ createBoard(); }
        renderAll();
    }
    function showFloatScore(gained, combo) {
        var wrap = document.querySelector('.board-wrap');
        var el = document.createElement('div');
        el.className = 'float-score';
        el.textContent = combo > 1 ? '+' + gained + ' 连击x' + combo : '+' + gained;
        el.style.left = '50%';
        el.style.top = '42%';
        wrap.appendChild(el);
        setTimeout(function () { el.remove(); }, 950);
    }
    function updateScoreUI() {
        scoreEl.textContent = score;
        if (score > best) {
            best = score;
            bestEl.textContent = best;
        }
    }
    /* ===== 计时 ===== */
    function startTimer() {
        if(practiceMode) return;
        startTs = performance.now();
        lastTick = -1;
        rafId = requestAnimationFrame(tick);
    }
    function tick(now) {
        if(practiceMode) return;
        var elapsed = (now - startTs) / 1000;
        timeLeft = Math.max(0, GAME_SECONDS - Math.floor(elapsed));
        timeEl.textContent = timeLeft;
        timeEl.classList.toggle('urgent', timeLeft <= 10);
        if (timeLeft !== lastTick && timeLeft <= 10 && timeLeft > 0) AudioFX.tick();
        lastTick = timeLeft;
        if (timeLeft <= 0) {
            endGame();
            return;
        }
        rafId = requestAnimationFrame(tick);
    }
    function stopTimer() {
        if (rafId) cancelAnimationFrame(rafId);
        rafId = null;
    }
    /* ===== 结束 ===== */
    function endGame() {
        stopTimer();
        running = false;
        busy = false;
        clearSelection();
        if (score > best) {
            best = score;
            saveBest(currentLevel, best);
            bestEl.textContent = best;
        }
        var won = score >= TARGET;
        endScoreEl.textContent = score;
        endTargetEl.textContent = TARGET;
        endBestEl.textContent = loadBest(currentLevel);
        if (won) {
            setCleared(currentLevel);
            AudioFX.win();
            endTrophy.className = 'trophy win';
            endTitle.textContent = currentLevel === LEVELS.length - 1 ? '全部通关！' : '通关！';
            endSub.textContent = '达标得分，' + LEVELS[currentLevel].label;
            var ratio = score / TARGET;
            if (ratio >= 1.6) endVerdictEl.textContent = '完美表现，仪器大师当之无愧！';
            else if (ratio >= 1.2) endVerdictEl.textContent = '轻松达标，继续保持！';
            else endVerdictEl.textContent = '刚好通关，再练一局冲高分！';
            endVerdictEl.className = 'verdict win';
            nextBtn.style.display = currentLevel < LEVELS.length - 1 ? '' : 'none';
        } else {
            AudioFX.fail();
            endTrophy.className = 'trophy fail';
            endTitle.textContent = '还差一点';
            endSub.textContent = '未达目标分，再来一次';
            var gap = TARGET - score;
            endVerdictEl.textContent = '距通关还差 ' + gap + ' 分，继续加油！';
            endVerdictEl.className = 'verdict fail';
            nextBtn.style.display = 'none';
        }
        renderLevelCards();
        endOverlay.classList.add('show');
    }
    function enterLevel(lv) {
        currentLevel = lv;
        var conf = LEVELS[lv];
        SIZE = conf.size;
        GAME_SECONDS = conf.seconds;
        TARGET = conf.target;
        TOTAL_PAIRS = conf.pairs;
        tryFullscreen();
        gameTitle.textContent = conf.label;
        gameSub.textContent = SIZE + ' × ' + SIZE + ' · ' + GAME_SECONDS + ' 秒';
        targetEl.textContent = TARGET;
        stopTimer();
        endOverlay.classList.remove('show');
        levelView.classList.remove('active');
        gameView.classList.add('active');
        score = 0;
        timeLeft = GAME_SECONDS;
        comboCount = 0;
        clearedPairs = 0;
        selected = null;
        busy = false;
        scoreEl.textContent = '0';
        if(practiceMode){
            timeEl.textContent="—";
        }else{
            timeEl.textContent = GAME_SECONDS;
        }
        timeEl.classList.remove('urgent');
        best = loadBest(lv);
        bestEl.textContent = best;
        buildGrid();
        createBoard();
        while(!hasValidPair()){ createBoard(); }
        renderAll();
        running = true;
        if(!practiceMode){
            startTimer();
        }
    }
    function backToLevels() {
        stopTimer();
        running = false;
        busy = false;
        endOverlay.classList.remove('show');
        gameView.classList.remove('active');
        levelView.classList.add('active');
        renderLevelCards();
    }
    function restart() {
        enterLevel(currentLevel);
    }
    function renderLevelCards() {
        levelGrid.innerHTML = '';
        LEVELS.forEach(function (conf, i) {
            var card = document.createElement('div');
            card.className = 'level-card ' + conf.cls;
            card.dataset.lv = i;
            var num = document.createElement('div');
            num.className = 'lv-num';
            num.textContent = '第' + (i + 1) + '关';
            var size = document.createElement('div');
            size.className = 'lv-size';
            size.textContent = conf.size + ' × ' + conf.size;
            var meta = document.createElement('div');
            meta.className = 'lv-meta';
            meta.innerHTML = '限时 <b>' + conf.seconds + ' 秒</b> · 目标 <b>' + conf.target + ' 分</b>';
            var bestLine = document.createElement('div');
            bestLine.className = 'lv-best';
            var b = loadBest(i);
            bestLine.textContent = '最高 ' + b + ' 分';
            var cleared = document.createElement('div');
            cleared.className = 'lv-cleared' + (isCleared(i) ? ' show' : '');
            cleared.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>';
            card.appendChild(num);
            card.appendChild(size);
            card.appendChild(meta);
            card.appendChild(bestLine);
            card.appendChild(cleared);
            levelGrid.appendChild(card);
            card.addEventListener('click', function () {
                AudioFX.unlock();
                enterLevel(i);
            });
        });
    }
    var toastTimer = null;
    function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
    }
    restartBtn.addEventListener('click', function () { AudioFX.unlock(); restart(); });
    againBtn.addEventListener('click', function () { AudioFX.unlock(); restart(); });
    nextBtn.addEventListener('click', function () {
        if (currentLevel < LEVELS.length - 1) enterLevel(currentLevel + 1);
    });
    closeBtn.addEventListener('click', backToLevels);
    backBtn.addEventListener('click', backToLevels);
    renderLevelCards();
    function tryFullscreen() {
        var el = document.documentElement;
        try {
            if (el.requestFullscreen) {
                var p = el.requestFullscreen();
                if (p && p.catch) p.catch(function () {});
            } else if (el.webkitRequestFullscreen) {
                el.webkitRequestFullscreen();
            }
        } catch (e) {}
    }
    document.addEventListener('pointerdown', function firstTap() {
        tryFullscreen();
        document.removeEventListener('pointerdown', firstTap);
    }, { passive: true });
    document.addEventListener('visibilitychange', function () {
        if (document.hidden && running) {
            stopTimer();
        } else if (!document.hidden && running && rafId === null && !practiceMode) {
            startTs = performance.now() - (GAME_SECONDS - timeLeft) * 1000;
            lastTick = -1;
            rafId = requestAnimationFrame(tick);
        }
    });
})();
</script>
</body>
