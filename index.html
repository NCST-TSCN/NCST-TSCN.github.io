<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导航主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 50px;
        }
        
        h1 {
            font-size: 2.5rem;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: #7f8c8d;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }
        
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            padding: 25px;
            transition: all 0.3s ease;
            cursor: pointer;
            height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }
        
        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #3498db, #9b59b6);
        }
        
        .card-title {
            font-size: 1.8rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        .card-subtitle {
            font-size: 1.1rem;
            color: #7f8c8d;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        
        .card-update {
            font-size: 0.9rem;
            color: #95a5a6;
            align-self: flex-end;
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .card {
                height: 160px;
                padding: 20px;
            }
            
            .card-title {
                font-size: 1.5rem;
            }
        }
        
        @media (max-width: 480px) {
            .grid {
                grid-template-columns: 1fr;
            }
            
            body {
                padding: 20px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>我的导航主页</h1>
            <p class="subtitle">点击下方卡片访问相关内容</p>
        </header>
        
        <div class="grid">
            <!-- 卡片1 -->
            <div class="card" onclick="window.location.href='hxfcspp.html'">
                <div>
                    <div class="card-title">方程式配平</div>
                    <div class="card-subtitle">只用最小公倍数法</div>
                </div>
                <div class="card-update">更新于：2025-11-15</div>
            </div>
            
            <!-- 卡片2 -->
            <div class="card" onclick="window.location.href='hxfcsjs.html'">
                <div>
                    <div class="card-title">计算题</div>
                    <div class="card-subtitle">利用化学方程式进行简单的计算</div>
                </div>
                <div class="card-update">更新于：2025-11-24</div>
            </div>
            
            <!-- 卡片3 -->
            <div class="card" onclick="window.location.href='hxjs.html'">
                <div>
                    <div class="card-title">湖北中考计算题</div>
                    <div class="card-subtitle">湖北中考计算题都是2问，且都给了化学方程式</div>
                </div>
                <div class="card-update">更新于：2025-12-02</div>
            </div>
            
            <!-- 卡片4 -->
            <div class="card" onclick="window.location.href='https://www.baidu.com'">
                <div>
                    <div class="card-title">个人作品</div>
                    <div class="card-subtitle">展示个人创作和项目成果，包括设计和开发作品</div>
                </div>
                <div class="card-update">更新于：2023-10-08</div>
            </div>
            
            <!-- 卡片5 -->
            <div class="card" onclick="window.location.href='https://www.baidu.com'">
                <div>
                    <div class="card-title">技术文档</div>
                    <div class="card-subtitle">技术笔记和文档资料，记录学习和解决问题的过程</div>
                </div>
                <div class="card-update">更新于：2023-10-05</div>
            </div>
            
            <!-- 卡片6 -->
            <div class="card" onclick="window.location.href='https://www.baidu.com'">
                <div>
                    <div class="card-title">资源下载</div>
                    <div class="card-subtitle">提供各种资源的下载链接，包括软件、模板和素材</div>
                </div>
                <div class="card-update">更新于：2023-10-01</div>
            </div>
        </div>
    </div>

    <script>
        // 可以在这里添加交互功能
        // 例如：点击卡片时的动画效果或数据统计
        
        // 为所有卡片添加点击效果
        document.querySelectorAll('.card').forEach(card => {
            card.addEventListener('click', function() {
                // 添加点击反馈
                this.style.transform = 'scale(0.98)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 150);
            });
        });
    </script>
</body>

</html>
